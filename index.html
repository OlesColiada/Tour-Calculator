<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Калькулятор вартості туру</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --ink:#1c2b2e;
  --paper:#f1ede2;
  --paper-dim:#e7e1d1;
  --teal:#0f4c4c;
  --teal-deep:#0a3535;
  --gold:#c69a2e;
  --gold-dim:#e4c877;
  --line:#c9c1a8;
  --red:#a3402f;
  --white:#fffdf8;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:0 0 80px 0;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

header{background:var(--teal-deep);color:var(--white);padding:36px 0 26px 0;border-bottom:4px solid var(--gold);}
header .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
.brand-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo-badge{background:var(--white);border-radius:10px;padding:8px 14px;display:flex;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.2);}
.logo-badge img{height:52px;width:auto;display:block;}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:34px;margin:0;letter-spacing:.2px;}
header p{margin:6px 0 0 0;color:#cfe3df;font-size:14px;letter-spacing:.3px;}
.stamp{font-family:'JetBrains Mono',monospace;font-size:12px;border:1.5px solid var(--gold-dim);color:var(--gold-dim);padding:6px 12px;border-radius:2px;transform:rotate(-2deg);letter-spacing:1px;}
.storage-note{font-size:11.5px;color:#9fb; opacity:.75;margin-top:4px;}

.tabbar{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 0 0;align-items:center;}
.tab{position:relative;background:var(--white);border:1.5px solid var(--line);border-radius:3px 10px 10px 3px;padding:9px 34px 9px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s ease;}
.tab::before{content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);}
.tab.active{background:var(--teal);color:var(--white);border-color:var(--teal-deep);box-shadow:2px 3px 0 var(--gold);}
.tab.active::before{border-color:var(--teal-deep);background:var(--gold);}
.tab .rm{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55;line-height:1;}
.tab .rm:hover{opacity:1;color:var(--red);}
.tab input{background:transparent;border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px;color:inherit;width:auto;min-width:40px;}
.addtab{border:1.5px dashed var(--line);background:transparent;color:var(--teal);border-radius:8px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;}
.addtab:hover{background:var(--paper-dim);}

.save-bar{display:flex;gap:10px;align-items:center;margin:16px 0 0 0;}
.saved-panel{background:var(--white);border:1px solid var(--line);border-radius:4px;margin-top:14px;padding:18px 20px;}

details.collapsible-block{margin-top:22px;}
details.collapsible-block summary{cursor:pointer;font-family:'Inter',sans-serif;font-size:12.5px;color:#6b6455;list-style:none;display:flex;align-items:center;gap:7px;user-select:none;}
details.collapsible-block summary::-webkit-details-marker{display:none;}
details.collapsible-block summary::before{content:'▸';font-size:11px;color:var(--gold);transition:transform .15s ease;flex-shrink:0;}
details.collapsible-block[open] > summary::before{transform:rotate(90deg);}
details.collapsible-block .collapsible-body{margin-top:12px;}

details.card-collapsible summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;user-select:none;}
details.card-collapsible summary::-webkit-details-marker{display:none;}
details.card-collapsible summary h2{margin:0;}
details.card-collapsible summary::before{content:'▸';font-size:14px;color:var(--gold);transition:transform .15s ease;flex-shrink:0;}
details.card-collapsible[open] > summary::before{transform:rotate(90deg);}
details.card-collapsible .collapsible-body{margin-top:16px;}
table.saved-table{width:100%;border-collapse:collapse;font-size:13px;}
table.saved-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7a7360;padding:6px 8px;border-bottom:2px solid var(--line);font-weight:600;}
table.saved-table td{padding:8px;border-bottom:1px solid var(--paper-dim);vertical-align:middle;}
table.saved-table td.price{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--teal-deep);text-align:right;}
.saved-empty{font-size:13px;color:#9a927a;padding:8px 0;}
.saved-actions{display:flex;gap:6px;}
.saved-actions button{font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer;font-family:'JetBrains Mono',monospace;}
.btn-open{background:var(--teal);color:var(--white);border:none;}
.btn-open:hover{background:var(--teal-deep);}
.btn-del{background:transparent;border:1px solid var(--line);color:var(--red);}
.btn-del:hover{background:#f6e9e6;}

.card{background:var(--white);border:1px solid var(--line);border-radius:4px;margin-top:22px;padding:22px 24px;}
.card h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px 0;color:var(--teal-deep);}
.card .sub{font-size:12.5px;color:#6b6455;margin-bottom:16px;}

.meta-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:6px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7a7360;font-weight:600;}
.field input,.field select{border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:13.5px;background:var(--paper);color:var(--ink);width:160px;}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:1px;background:var(--white);}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}

table.items{width:100%;border-collapse:collapse;margin-top:10px;}
table.items th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7a7360;padding:6px 8px;border-bottom:2px solid var(--line);font-weight:600;}
table.items td{padding:5px 8px;border-bottom:1px solid var(--paper-dim);}
table.items input[type=text]{width:100%;border:1px solid transparent;background:transparent;font-family:'Inter',sans-serif;font-size:13.5px;padding:6px 6px;border-radius:3px;}
table.items input[type=text]:hover,table.items input[type=text]:focus{border-color:var(--line);background:var(--paper);}
table.items input[type=number]{width:110px;border:1px solid var(--line);background:var(--paper);font-family:'JetBrains Mono',monospace;font-size:13.5px;padding:6px 8px;border-radius:3px;text-align:right;}
table.items input[type=number]:focus{outline:2px solid var(--teal);outline-offset:0;background:var(--white);}
.del-btn{background:none;border:none;color:#a99;cursor:pointer;font-size:16px;padding:2px 8px;}
.del-btn:hover{color:var(--red);}
.add-row{margin-top:10px;background:none;border:1.5px dashed var(--line);color:var(--teal);padding:7px 14px;border-radius:5px;font-size:12.5px;font-family:'JetBrains Mono',monospace;cursor:pointer;}
.add-row:hover{background:var(--paper-dim);}
.grp-total{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--teal-deep);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:880px){.two-col{grid-template-columns:1fr;}}

/* city picker */
.picker-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
.city-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;max-height:180px;overflow-y:auto;padding:10px;background:var(--paper);border-radius:5px;border:1px solid var(--paper-dim);}
.city-chip-option{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:5px 10px 5px 8px;font-size:12.5px;cursor:pointer;user-select:none;}
.city-chip-option:hover{border-color:var(--teal);}
.city-chip-option.checked{background:var(--teal);color:var(--white);border-color:var(--teal-deep);}
.city-chip-option .cost{font-family:'JetBrains Mono',monospace;opacity:.75;font-size:11.5px;}
.cost-display{font-family:'JetBrains Mono',monospace;opacity:.8;font-size:11.5px;}
.edit-pencil{background:none;border:none;cursor:pointer;font-size:11px;opacity:.45;padding:0 2px;color:inherit;}
.edit-pencil:hover{opacity:1;}
.chip-cost-edit{width:64px;border:1px solid var(--gold);border-radius:3px;padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;background:var(--white);}
.city-chip-option.checked .chip-cost-edit{background:var(--white);color:var(--ink);}
.city-chip-option.checked .edit-pencil{color:var(--white);}
.add-city-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.add-city-form input{border:1px solid var(--line);border-radius:3px;padding:6px 9px;font-size:12.5px;font-family:'Inter',sans-serif;}
.add-city-form input.cost-inp{width:90px;font-family:'JetBrains Mono',monospace;text-align:right;}
.add-city-form input.name-inp{width:150px;}
.mini-btn{background:var(--teal);color:var(--white);border:none;border-radius:4px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;}
.mini-btn:hover{background:var(--teal-deep);}
.mini-btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line);}

.unit-toggle{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle;}
.unit-btn{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:1px 7px;font-size:10px;line-height:1.6;cursor:pointer;color:#7a7360;font-family:'JetBrains Mono',monospace;}
.unit-btn.active{background:var(--teal);color:var(--white);border-color:var(--teal-deep);}
.unit-btn:hover{border-color:var(--teal);}

.selected-strip{margin-top:10px;}
.sel-chip{display:inline-flex;align-items:center;gap:8px;background:var(--gold-dim);border-radius:14px;padding:6px 8px 6px 12px;font-size:12.5px;margin:0 8px 8px 0;}
.sel-chip .rm2{cursor:pointer;opacity:.6;font-weight:700;}
.sel-chip .rm2:hover{opacity:1;color:var(--red);}
.sel-chip select, .sel-chip input{border:1px solid var(--line);border-radius:3px;font-size:12px;padding:3px 5px;font-family:'JetBrains Mono',monospace;background:var(--white);}
.sel-chip input.days-inp{width:44px;text-align:center;}

.subtotal-line{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--paper-dim);font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--teal-deep);font-size:13.5px;}

.escort-block{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--paper-dim);}

.day-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.day-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:#7a7360;width:150px;flex-shrink:0;}
.day-city{flex:1;min-width:160px;border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-family:'Inter',sans-serif;font-size:13px;background:var(--paper);width:100%;box-sizing:border-box;}
.day-city:focus{outline:2px solid var(--teal);outline-offset:1px;background:var(--white);}
.city-auto-wrap{position:relative;flex:1;min-width:160px;}
.city-suggest{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--line);border-top:none;max-height:260px;overflow-y:auto;z-index:80;box-shadow:0 8px 18px rgba(20,30,30,.15);border-radius:0 0 4px 4px;}
.city-suggest:empty{display:none;}
.city-suggest-country{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#9a927a;padding:7px 10px 3px;background:var(--paper);}
.city-suggest-item{padding:7px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;color:var(--ink);}
.city-suggest-item:hover,.city-suggest-item.active{background:var(--gold-dim);}
.day-night{border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:12.5px;font-family:'Inter',sans-serif;background:var(--paper);width:190px;}
.day-timeline-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--paper-dim);border-radius:6px;padding:10px 6px;}
.tl-node{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;}
.tl-play .tl-node{opacity:1;transform:translateY(0);}
.tl-bus{transform:translateX(0);}

/* results */
.breakdown{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:13.5px;}
.headline-price{background:var(--teal-deep);color:var(--white);border-radius:8px;padding:18px 22px;margin-bottom:20px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--gold);}
.headline-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:#cfe3df;font-family:'JetBrains Mono',monospace;}
.headline-value{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--white);line-height:1.2;}
.headline-value .uah-amt{color:#cfe3df;font-size:.55em;opacity:.95;margin-left:10px;font-weight:600;}
.headline-slider-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.headline-slider-row input[type=range]{flex:1;accent-color:var(--gold);height:20px;cursor:pointer;}
.headline-slider-end{font-family:'JetBrains Mono',monospace;font-size:11px;color:#9fc2bc;}
@media(max-width:520px){.headline-value{font-size:22px;}}
.channel-scenarios-box{background:var(--paper);border:1px solid var(--paper-dim);border-left:4px solid var(--gold);border-radius:6px;padding:16px 20px;margin:18px 0 24px;}
.channel-scenarios-title{font-family:'Fraunces',serif;font-size:15px;color:var(--teal-deep);margin-bottom:2px;}
.channel-scenarios-sub{font-size:11.5px;color:#7a7360;margin-bottom:10px;}
.channel-scenarios-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--ink);}
.channel-scenarios-row:last-child{border-bottom:none;}
.channel-scenarios-row strong{color:var(--teal-deep);flex-shrink:0;}
.breakdown td{padding:9px 6px;border-bottom:1px solid var(--paper-dim);}
.breakdown td:first-child{font-family:'Inter',sans-serif;color:var(--ink);}
.breakdown td:last-child{text-align:right;}
.breakdown tr.total td{font-weight:700;background:var(--gold-dim);color:var(--teal-deep);font-size:15px;}
.breakdown tr.sep td{border-top:2px solid var(--line);padding-top:14px;}

table.items select.itscope{border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-size:12px;font-family:'Inter',sans-serif;background:var(--paper);}
table.items tr.item-disabled{opacity:.45;}
table.items input.itenabled{width:16px;height:16px;cursor:pointer;}

.lock-banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--gold-dim);border:1px solid var(--gold);border-radius:5px;padding:12px 16px;margin-top:20px;font-size:13px;color:var(--teal-deep);}
.locked-overlay{pointer-events:none;opacity:.55;user-select:none;filter:grayscale(.2);}
.share-row{display:flex;gap:10px;flex-wrap:wrap;}

.size-table-wrap{overflow-x:auto;margin-top:8px;}
table.size-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:13px;min-width:560px;}
table.size-table th{background:var(--teal-deep);color:var(--white);padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;text-align:right;}
table.size-table th:first-child{text-align:left;}
table.size-table td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--paper-dim);}
table.size-table td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:600;color:var(--teal-deep);}
table.size-table tr.price-row td{font-weight:700;background:var(--gold-dim);color:var(--teal-deep);}
table.size-table th.col-min-group{background:var(--gold);color:var(--teal-deep);}
table.size-table td.col-min-group{background:#fbf1d6;box-shadow:inset 0 0 0 2px var(--gold);}
table.size-table tr.price-row td.col-min-group{background:var(--gold);color:var(--teal-deep);}

.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.map-btn{width:52px;height:52px;background:var(--teal);border:1.5px solid var(--gold-dim);border-radius:8px;color:var(--white);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.2);flex-shrink:0;}
.map-btn:hover{background:var(--teal-deep);}
.map-btn .map-icon{font-size:18px;line-height:1;}
.map-section{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--paper-dim);}
.map-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.map-section h4{font-family:'Fraunces',serif;font-size:15px;color:var(--teal-deep);margin:0 0 8px;}
.map-city-list{font-size:12.5px;color:#4a4438;background:var(--paper);border-radius:5px;padding:8px 12px;margin-bottom:10px;}
.map-km-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
#mapDayAssignArea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;background:var(--paper);box-sizing:border-box;margin-bottom:8px;}
.map-open-btn-lg{display:block;width:100%;margin-top:14px;padding:14px 18px;font-size:15px;font-weight:700;border-radius:7px;}

.file-menu-btn{width:46px;height:46px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:var(--white);font-size:20px;cursor:pointer;flex-shrink:0;}
.file-menu-btn:hover{background:rgba(255,255,255,.16);}
.file-menu-overlay{position:fixed;inset:0;background:rgba(10,20,20,.35);z-index:1150;display:none;}
.file-menu-overlay.open{display:block;}
.file-menu-panel{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:85vw;background:var(--teal-deep);box-shadow:4px 0 24px rgba(0,0,0,.35);transform:translateX(-100%);transition:transform .2s ease;z-index:1151;padding:18px 0;}
.file-menu-overlay.open .file-menu-panel{transform:translateX(0);}
.file-menu-header{padding:8px 22px 16px;font-family:'Fraunces',serif;font-size:19px;color:var(--white);border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px;position:relative;}
.file-menu-close{position:absolute;top:0;right:14px;background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:4px;}
.file-menu-close:hover{color:var(--white);}
.file-menu-item{display:flex;align-items:center;gap:14px;padding:14px 22px;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--white);cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.file-menu-item:hover{background:rgba(255,255,255,.09);}
.file-menu-item .fmi-icon{font-size:17px;width:20px;text-align:center;flex-shrink:0;}
.file-menu-sep{height:1px;background:rgba(255,255,255,.15);margin:10px 22px;}

.rate-badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--white);min-width:230px;}
.rate-badge-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px;color:#cfe3df;}
.rate-badge-row strong{color:var(--white);font-weight:700;}
.rate-badge-row input{width:44px;border:1px solid var(--gold-dim);border-radius:3px;padding:2px 4px;font-family:'JetBrains Mono',monospace;font-size:11.5px;text-align:right;background:var(--white);color:var(--ink);margin-right:3px;}
.rate-badge-date{font-size:10px;color:#9fc2bc;margin-bottom:8px;}
.rate-badge .mini-btn.ghost{color:var(--gold-dim);border-color:rgba(255,255,255,.3);width:100%;font-size:10.5px;padding:5px 10px;}
.rate-badge .mini-btn.ghost:hover{background:rgba(255,255,255,.1);}

.uah-amt{opacity:.68;font-size:.88em;margin-left:4px;}

.dirty-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:none;flex-shrink:0;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--teal-deep);color:var(--white);padding:11px 20px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:80vw;text-align:center;}
.toast.show{opacity:1;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,20,20,.45);display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px;}
.modal-card{background:var(--white);border-radius:6px;padding:24px 26px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);position:relative;}
.modal-close-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;line-height:1;color:#9a927a;cursor:pointer;padding:4px;border-radius:4px;}
.modal-close-x:hover{color:var(--red);background:var(--paper-dim);}
.modal-card.wide{max-width:680px;max-height:86vh;overflow-y:auto;}
.rm-tiers{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:13px;}
.rm-tiers th{background:var(--teal-deep);color:var(--white);padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;}
.rm-tiers td{padding:8px 10px;border-bottom:1px solid var(--paper-dim);}
.rm-tiers tr.rm-current td{background:var(--gold-dim);font-weight:700;}
.rm-section h4{font-family:'Fraunces',serif;font-size:15px;color:var(--teal-deep);margin:18px 0 6px;}
.rm-section ul{margin:0 0 4px;padding-left:20px;}
.rm-section li{margin-bottom:6px;font-size:13px;line-height:1.5;}
.rm-note{font-size:12px;color:#7a7360;margin-top:4px;}
.modal-title{font-family:'Fraunces',serif;font-size:19px;margin:0 0 8px 0;color:var(--teal-deep);}
.modal-message{font-size:13.5px;color:#4a4438;margin-bottom:20px;line-height:1.55;}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}

footer{text-align:center;color:#8a8368;font-size:12px;margin-top:40px;}
</style>

function matchCitySuggestions(query){
  const q = String(query||'').trim().toLowerCase();
  if(!q) return {};
  const matches = EUROPE_CITIES.filter(c=>c.city.toLowerCase().startsWith(q)).slice(0,40);
  const grouped = {};
  matches.forEach(m=>{
    if(!grouped[m.country]) grouped[m.country] = [];
    grouped[m.country].push(m.city);
  });
  return grouped;
}

function citySuggestHtml(query){
  const grouped = matchCitySuggestions(query);
  const countries = Object.keys(grouped);
  if(!countries.length) return '';
  return countries.map(c=>`
    <div class="city-suggest-country">${escapeHtml(c)}</div>
    ${grouped[c].map(city=>`<div class="city-suggest-item" data-city="${escapeHtml(city)}">${escapeHtml(city)}</div>`).join('')}
  `).join('');
}

/* ---------- NBU EXCHANGE RATE (EUR->UAH), with an editable bank/commission markup ---------- */
let nbuRate = null;       // official NBU rate, UAH per 1 EUR
let nbuRateDate = null;   // as returned by NBU ("dd.mm.yyyy")
let nbuRateError = false;
let rateMarkupMode = 'percent'; // 'percent' | 'fixed'
let rateMarkupPercent = 3;      // % buffer for bank fees/commissions
let rateMarkupFixed = 0.50;    // flat UAH (kopecks-precision) added directly to the NBU rate

function round2(n){
  return Math.round((Number(n)||0)*100)/100;
}

function workingRate(){
  if(nbuRate==null) return null;
  if(rateMarkupMode==='fixed'){
    return round2(nbuRate + (Number(rateMarkupFixed)||0));
  }
  return round2(nbuRate * (1 + (Number(rateMarkupPercent)||0)/100));
}

// €X.X plus a muted (₴Y.YY) conversion at the current working rate, if known. Returns HTML.
function fmtBoth(eur){
  const base = fmt(eur);
  const wr = workingRate();
  if(wr==null) return base;
  const uah = round2(eur*wr);
  return `${base}<span class="uah-amt">(₴${uah.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})})</span>`;
}

async function fetchNbuRate(){
  try{
    const res = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
    if(!res.ok) throw new Error('NBU HTTP '+res.status);
    const data = await res.json();
    if(Array.isArray(data) && data[0] && data[0].rate){
      nbuRate = round2(data[0].rate);
      nbuRateDate = data[0].exchangedate || null;
      nbuRateError = false;
    } else {
      throw new Error('Unexpected NBU response');
    }
  }catch(e){
    nbuRateError = true;
  }
  renderRateBadge();
  refreshAllPriceDisplays();
}

function renderRateBadge(){
  const val = document.getElementById('nbuRateValue');
  const working = document.getElementById('workingRateValue');
  const dateEl = document.getElementById('rateDateText');
  if(nbuRate==null){
    if(val) val.textContent = nbuRateError ? 'немає звʼязку' : '…';
    if(working) working.textContent = '—';
    if(dateEl) dateEl.textContent = '';
    return;
  }
  if(val) val.textContent = nbuRate.toFixed(2) + ' ₴';
  const wr = workingRate();
  if(working) working.textContent = wr.toFixed(2) + ' ₴';
  if(dateEl) dateEl.textContent = 'станом на ' + nbuRateDate;
}

// The markup field itself swaps between a %-input and a ₴-input depending on mode.
// Rebuilt only on a mode-toggle click (not on every keystroke), so typing never loses focus.
function rateMarkupFieldHtml(){
  if(rateMarkupMode==='fixed'){
    return `<input type="text" inputmode="decimal" id="rateMarkupFixedInput" value="${round2(rateMarkupFixed).toFixed(2).replace('.',',')}">₴`;
  }
  return `<input type="text" inputmode="decimal" id="rateMarkupInput" value="${String(rateMarkupPercent).replace('.',',')}">%`;
}

function wireRateMarkupField(){
  const pInp = document.getElementById('rateMarkupInput');
  if(pInp) pInp.addEventListener('input', e=>{
    rateMarkupPercent = Number(e.target.value.replace(',','.'))||0;
    renderRateBadge();
    refreshAllPriceDisplays();
  });
  const fInp = document.getElementById('rateMarkupFixedInput');
  if(fInp) fInp.addEventListener('input', e=>{
    rateMarkupFixed = Number(e.target.value.replace(',','.'))||0;
    renderRateBadge();
    refreshAllPriceDisplays();
  });
}

function renderRateMarkupField(){
  const wrap = document.getElementById('rateMarkupFieldWrap');
  if(wrap){ wrap.innerHTML = rateMarkupFieldHtml(); wireRateMarkupField(); }
  document.querySelectorAll('[data-ratemarkupmode]').forEach(btn=>{
    const active = btn.dataset.ratemarkupmode===rateMarkupMode;
    btn.style.background = active ? 'var(--teal)' : '';
    btn.style.color = active ? 'var(--white)' : '';
    btn.style.borderColor = active ? 'var(--teal-deep)' : '';
  });
}

// Only the price-per-person outputs use fmtBoth(), so a rate/markup change only needs to
// recompute the results card and the base-group numbers — not the whole route body (which would
// also rebuild whatever field the user might currently be typing in elsewhere).
function refreshAllPriceDisplays(){
  if(routes.length && activeId!=null){
    refreshResults();
  }
}

function snapshotRoute(route){
  const clone = JSON.parse(JSON.stringify(route));
  delete clone.id;
  delete clone.savedId;
  delete clone.savedSnapshotJSON;
  delete clone.locked;
  return clone;
}

function routeIsDirty(route){
  if(route.savedSnapshotJSON == null) return true;
  return JSON.stringify(snapshotRoute(route)) !== route.savedSnapshotJSON;
}

function markRouteClean(route){
  route.savedSnapshotJSON = JSON.stringify(snapshotRoute(route));
}

// Рахує 3 цінові транші (ранній продаж / стандарт / останні місця) від поточної ціни
// (для обраного повзунком розміру групи), плюс мінімальну розумну ціну (маржинальна
// собівартість + буфер) і скільки місць за стандартною ціною треба продати до беззбитковості.
function rmComputeTiers(route){
  const r = computeRoute(route);
  const mf = mandatoryFeeInfo(route, r);
  const hgs = Math.min(65, Math.max(25, Math.floor(route.headlineGroupSize)||MIN_GROUP_SIZE));
  const core = priceForCounts(r.groupTotal, r.personTotal, hgs, 0, route.profit, route.agency);
  const standard = withMandatoryFee(core, mf).total;
  const marginal = r.personTotal + r.cityTaxTotal;
  const floorPrice = Math.ceil((marginal+15)/5)*5;
  let earlyBird = roundToStep(standard*0.90, 5);
  if(earlyBird < floorPrice) earlyBird = floorPrice;
  const lastMinute = roundToStep(standard*1.12, 5);
  const fixed = r.groupTotal;
  const seatsToBreakEven = standard>marginal ? Math.ceil(fixed/(standard-marginal)) : null;
  return {hgs, standard, marginal, floorPrice, earlyBird, lastMinute, fixed, seatsToBreakEven};
}

// Динамічна комісія на допродаж останніх місць: якщо продано близько до цілі (hgs) і лишилось
// мало місць — вигідніше підняти комісію агенту на решту, ніж лишити місце порожнім (порожнє
// місце коштує повну маржинальну різницю standard-marginal, а не тільки суму надбавки комісії).
function rmComputeLastSeatsBoost(route, t){
  const sold = Array.isArray(route.sales) ? route.sales.length : 0;
  const unsold = Math.max(0, t.hgs - sold);
  const currentPct = Number(route.agencyPercent)||10;
  const threshold = Math.max(5, Math.round(t.hgs*0.15));
  const active = sold>0 && unsold>0 && unsold<=threshold;
  const boostPct = Math.min(currentPct+8, 30);
  const boostCommission = Math.max(25, roundToStep(t.standard*boostPct/100, 5));
  const maxSensibleCommission = Math.max(0, t.standard - t.marginal - 5); // лишає хоч трохи маржі
  return {sold, unsold, currentPct, threshold, active, boostPct, boostCommission: Math.min(boostCommission, roundToStep(Math.max(maxSensibleCommission,25),5))};
}

// Платні місця в автобусі (вибір хороших місць) — майже чистий прибуток: жодних додаткових
// витрат на маршрут це не додає, лише перерозподіляє місця в салоні.
function rmComputeSeatUpsell(t){
  const rate = 10; // типова ставка, яку бачимо в реальних заявках OneBox
  const uptakeShare = 0.3; // орієнтовна частка тих, хто погоджується доплатити за місце
  const estIncome = roundToStep(rate*t.hgs*uptakeShare, 5);
  return {rate, uptakeShare, estIncome};
}

        <li>Доплату за одномісне розміщення тримайте окремою надбавкою поза основною ціновою сіткою, щоб не спотворювати транші.</li>

// Немає власного вбудованого Google Maps (це вимагає платного API-ключа Google, який
// небезпечно зашивати в статичний файл) — натомість місток: відкриваємо маршрут як посилання
// в реальному Google Maps (без ключа), а довжину/міста повертаємо в калькулятор вручну.
const MAP_KM_BUFFER = 200; // запас на маршрут (з'їзди, об'їзди, зворотний шлях і т.п.)

function mapRouteCities(route){
  return route.dayPlan.map(d=>(d.city||'').trim()).filter(Boolean);
}

function buildGoogleMapsUrl(cities){
  return 'https://www.google.com/maps/dir/' + cities.map(c=>encodeURIComponent(c)).join('/');
}

// Безкоштовний спосіб показати маршрут прямо в iframe (без платного Maps Embed API-ключа) —
// стара, але досі робоча схема директрій Google Maps. Це неофіційний метод: Google теоретично
// може змінити/прибрати його в майбутньому, тоді лишиться кнопка «на весь екран» нижче.
function buildGoogleMapsEmbedUrl(cities){
  if(cities.length<2) return null;
  const saddr = encodeURIComponent(cities[0]);
  const daddr = cities.slice(1).map(c=>encodeURIComponent(c)).join('+to:');
  return `https://maps.google.com/maps?saddr=${saddr}&daddr=${daddr}&output=embed`;
}

      <button type="button" class="mini-btn map-open-btn-lg" id="mapOpenBtn">🗺️ ${cities.length>=2 ? 'Відкрити поточний маршрут у Google Maps' : 'Відкрити Google Maps (з нуля)'}</button>

      <textarea id="mapDayAssignArea" placeholder="Львів&#10;Зальцбург&#10;Цюрих&#10;..."></textarea>

function fmt0km(n){
  return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:1});
}

async function saveRoute(route){
  const computed = computeRoute(route);
  const price30core = priceForCounts(computed.groupTotal, computed.personTotal, MIN_GROUP_SIZE, 0, route.profit, route.agency);
  const price30 = withMandatoryFee(price30core, mandatoryFeeInfo(route, computed)).total;
  const snapshot = snapshotRoute(route);
  let ok = true;
  if(route.savedId){
    try{
      await sbUpdate('saved_routes', `saved_id=eq.${route.savedId}`, {
        name: route.name, snapshot, price30, days: route.days, saved_at: new Date().toISOString(),
      });
    }catch(e){ ok = false; }
  } else {
    const savedId = 's' + Date.now() + Math.floor(Math.random()*1000);
    const row = {saved_id: savedId, name: route.name, snapshot, price30, days: route.days};
    try{
      await sbInsert('saved_routes', [row]);
      route.savedId = savedId;
    }catch(e){ ok = false; }
  }
  if(ok) markRouteClean(route);
  await loadSavedRoutes();
  renderSavedBar();
  refreshSavedRoutesModalIfOpen();
  renderTabs();
  showToast(ok
    ? `Маршрут «${route.name}» збережено`
    : `Не вдалося зберегти «${route.name}» — перевірте звʼязок з базою`);
  return ok;
}
function openSavedRoute(savedId){
  const entry = savedRoutes.find(s=>s.savedId===savedId);
  if(!entry) return;
  const nr = newRoute(entry.name);
  Object.assign(nr, JSON.parse(JSON.stringify(entry.snapshot)));
  nr.name = entry.name;
  nr.locked = true;
  nr.savedId = savedId; // лишаємо привʼязку до запису в базі — «Зберегти маршрут» оновлює його, а не створює копію
  markRouteClean(nr); // свіжовідкритий маршрут поки без незбережених змін
  routes.push(nr);
  activeId = nr.id;
  hideModal();
  renderAll();
}

// Оновлює вміст модального вікна бази маршрутів «на місці», якщо воно зараз відкрите —
// щоб збереження/видалення одразу відображались, не закриваючи вікно користувачу.
function refreshSavedRoutesModalIfOpen(){
  if(!savedRoutesModalOpen) return;
  document.getElementById('appModalMessage').innerHTML = savedRoutesModalHtml();
  wireSavedRoutesModal();
}

// Постійний інструмент (не одноразова міграція): перераховує "Ціна/особу" для всіх записів
// бази за ПОТОЧНОЮ логікою калькулятора (formulas можуть змінюватись з часом — ця кнопка
// завжди підтягує старі записи під те, як рахує калькулятор зараз). Сам snapshot не чіпається,
// тільки відображувана ціна для порівняння в списку.
async function refreshAllSavedPrices(){
  showToast(`Перераховую ${savedRoutes.length} маршрутів...`, 4000);
  let updated = 0, failed = 0;
  for(const entry of savedRoutes){
    try{
      const snap = entry.snapshot;
      const computed = computeRoute(snap);
      const core = priceForCounts(computed.groupTotal, computed.personTotal, MIN_GROUP_SIZE, 0, snap.profit, snap.agency);
      const price30 = withMandatoryFee(core, mandatoryFeeInfo(snap, computed)).total;
      await sbUpdate('saved_routes', `saved_id=eq.${entry.savedId}`, {price30});
      updated++;
    }catch(e){ failed++; }
  }
  await loadSavedRoutes();
  renderSavedBar();
  refreshSavedRoutesModalIfOpen();
  showToast(failed ? `Оновлено ${updated}, помилок: ${failed}.` : `Оновлено всі ${updated} маршрутів.`, 3500);
}

function newRoute(name){
  const id = uid++;
  const route = {
    id, name: name || 'Новий маршрут', days: 0,
    dayPlan: [],
    road: { km: 0, pricePerKm: 0 },
    parkingSelected: [],
    excursionSelected: [],
    escortRate: 0,
    hotels: [],
    additional: [
      {name:'KPI', cost:0, scope:'group', enabled:true, autoSync:true, autoSyncRate:10},
      {name:'Страховка', cost:0, scope:'person', enabled:false, autoSync:true},
      {name:'Навушники', cost:0, scope:'person', enabled:false},
      {name:'Проживання Стафу', cost:0, scope:'group', enabled:false},
      {name:'Страховка КГ', cost:0, scope:'group', enabled:false},
      {name:'Реклама', cost:0, scope:'group', enabled:false},
    ],
    profit: 0,
    agency: 0,
    agencyMode: 'fixed', // 'fixed' | 'percent'
    agencyPercent: 10,
    cityTaxDailyRate: 4.98, // обов'язковий платіж компанії, €/день на учасника (покриває сітітакс; різниця з реальним сітітаксом ховається в базовій ціні)
    mandatoryFeeEnabled: true, // вимкнути для замовних груп, де турсервіс уже врахований іншим сценарієм
    headlineGroupSize: 40, // розмір групи, обраний повзунком для великого підсумкового блоку ціни
    sales: [], // фактично продані місця: {label, price, viaAgent, agentCommission} — для точки беззбитковості
    parkingCountryView: EURO_COUNTRIES[0],
    excursionCountryView: EURO_COUNTRIES[0],
    system: { type: '15+1', customPaying: 10, customFree: 1 },
    baseGroup: { size: 40, system: '15+1', extraFree: 0, discounts: [], extraPrice: null },
    locked: false,
    savedId: null,
    savedSnapshotJSON: null,
  };
  markRouteClean(route); // a brand-new, untouched route has nothing unsaved to prompt about
  return route;
}

function setDayCount(route, count){
  count = Math.max(0, Math.floor(Number(count)||0));
  const old = route.dayPlan;
  const next = [];
  for(let i=0;i<count;i++) next.push(old[i] || {city:'', nightType:'hotel'});
  route.dayPlan = next;
  route.days = count;
}

function nightTransfersCount(route){
  const n = route.dayPlan.length;
  if(n<2) return 0;
  return route.dayPlan.slice(0, n-1).filter(d=>d.nightType==='transfer').length;
}

function fmt(n){
  if(!isFinite(n)) return '—';
  return '€' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
// Показує підсумок продажної ціни як "база+платіж" (наприклад 233,10+24,90), а не одним числом.
function fmtSplitTotal(loweredBase, fee){
  return `${fmt(loweredBase)}+${fmt(fee).replace('€','')}`;
}
// Те саме, але з додаванням гривневого еквіваленту — для великого підсумкового блоку "ціна на особу".
function fmtHeadlinePrice(loweredBase, fee){
  const eurPart = fmtSplitTotal(loweredBase, fee);
  const wr = workingRate();
  if(wr==null) return eurPart;
  const uah = round2((loweredBase+fee)*wr);
  return `${eurPart}<span class="uah-amt">≈ ₴${uah.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
}
function getRoute(id){ return routes.find(r=>r.id===id); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------- TABS ---------- */
function switchToRoute(id){
  if(id===activeId) return;
  activeId = id;
  renderAll();
}

function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  routes.forEach(r=>{
    const tab = document.createElement('div');
    tab.className = 'tab' + (r.id===activeId ? ' active' : '');
    tab.dataset.id = r.id;
    tab.innerHTML = `<input type="text" value="${escapeHtml(r.name)}" data-id="${r.id}" class="tabname"/><span class="dirty-dot" data-dirty-id="${r.id}" title="Є незбережені зміни" style="display:${routeIsDirty(r)?'inline-block':'none'}"></span><span class="rm" data-id="${r.id}">✕</span>`;
    tab.addEventListener('click',(e)=>{
      if(e.target.classList.contains('rm')) return;
      switchToRoute(r.id);
    });
    bar.appendChild(tab);
  });
  const addBtn = document.createElement('button');
  addBtn.className='addtab'; addBtn.textContent='+ Маршрут';
  addBtn.onclick = ()=>{
    const nr = newRoute('Маршрут ' + uid);
    routes.push(nr); activeId = nr.id; renderAll();
  };
  bar.appendChild(addBtn);
  bar.querySelectorAll('.tabname').forEach(inp=>{
    inp.addEventListener('input', e=>{
      getRoute(Number(e.target.dataset.id)).name = e.target.value;
      updateTabDirtyDot();
    });
    // Clicking the name field of an inactive tab switches to it (like clicking anywhere else
    // on the tab); clicking it while already active just places the cursor for renaming —
    // in that case we deliberately do nothing extra so a full re-render doesn't interrupt typing.
    inp.addEventListener('click', e=>{
      e.stopPropagation();
      switchToRoute(Number(e.target.dataset.id));
    });
  });
  bar.querySelectorAll('.rm').forEach(x=>{
    x.addEventListener('click', e=>{
      e.stopPropagation();
      closeRouteTab(Number(e.target.dataset.id));
    });
  });
}

function updateTabDirtyDot(){
  document.querySelectorAll('.dirty-dot').forEach(dot=>{
    const r = getRoute(Number(dot.dataset.dirtyId));
    if(r) dot.style.display = routeIsDirty(r) ? 'inline-block' : 'none';
  });
}

function removeRouteTab(id){
  routes = routes.filter(r=>r.id!==id);
  if(!routes.length){
    // Ніколи не лишаємо застосунок зовсім без вкладок — відкриваємо чистий новий маршрут.
    routes.push(newRoute('Маршрут ' + uid));
  }
  if(activeId===id || !getRoute(activeId)) activeId = routes[0].id;
  renderAll();
}

function closeRouteTab(id){
  const route = getRoute(id);
  if(!route) return;
  if(!routeIsDirty(route)){
    removeRouteTab(id);
    return;
  }
  showModal({
    title: 'Незбережені зміни',

function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function routeTimelineSVG(route){
  const days = route.dayPlan;
  const n = days.length;
  if(n===0) return '<div style="font-size:12.5px;color:#9a927a;">Візуалізація зʼявиться після додавання днів.</div>';
  const dayWidth = 120;
  const width = Math.max(560, (n-1)*dayWidth + 80);
  const height = 110;
  const y = 46;
  const distance = (n-1)*dayWidth;
  const busDuration = Math.max(1.4, (n-1)*0.9);
  let svg = `<svg class="tl-svg" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;overflow:visible;" data-distance="${distance}" data-duration="${busDuration.toFixed(2)}">`;
  for(let i=0;i<n-1;i++){
    const x1 = 40+i*dayWidth, x2 = 40+(i+1)*dayWidth;
    const transfer = days[i].nightType==='transfer';
    svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${transfer?'#c69a2e':'#0f4c4c'}" stroke-width="3" ${transfer?'stroke-dasharray="7,6"':''}/>`;
    const midx = (x1+x2)/2;
    svg += `<text x="${midx}" y="${y-12}" font-size="10.5" text-anchor="middle" fill="${transfer?'#a3402f':'#0a3535'}" font-family="'JetBrains Mono',monospace">${transfer?'нічний переїзд':'готель'}</text>`;
  }
  days.forEach((d,i)=>{
    const x = 40+i*dayWidth;
    const isLast = i===n-1;
    const delay = n>1 ? (i/(n-1))*busDuration : 0;
    svg += `<g class="tl-node" style="transition-delay:${delay.toFixed(2)}s;">
      <circle cx="${x}" cy="${y}" r="9" fill="${isLast?'#c69a2e':'#0f4c4c'}" stroke="#fffdf8" stroke-width="2"/>
      <text x="${x}" y="${y+26}" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2b2e" font-family="'Inter',sans-serif">${escapeXml(d.city || ('День '+(i+1)))}</text>
      <text x="${x}" y="${y+42}" font-size="10" text-anchor="middle" fill="#7a7360" font-family="'JetBrains Mono',monospace">День ${i+1}</text>
    </g>`;
  });
  svg += `<text class="tl-bus" x="40" y="${y+7}" font-size="22" text-anchor="middle">🚌</text>`;
  svg += `</svg>`;
  return svg;
}

// Запускає анімацію "автобус їде + міста проявляються" один раз, коли елемент вперше зʼявляється у в'юпорті.
function initTimelineAnimation(wrapEl){
  if(!wrapEl) return;
  const svgEl = wrapEl.querySelector('.tl-svg');
  if(!svgEl) return;
  const play = ()=>{
    const distance = Number(svgEl.dataset.distance)||0;
    const duration = Number(svgEl.dataset.duration)||1.4;
    svgEl.classList.add('tl-play');
    const bus = svgEl.querySelector('.tl-bus');
    if(bus){
      bus.style.transition = `transform ${duration}s linear`;
      // невеличка затримка кадру, щоб transition гарантовано підхопився
      requestAnimationFrame(()=>{ bus.style.transform = `translateX(${distance}px)`; });
    }
  };
  if(!('IntersectionObserver' in window)){ play(); return; }
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        play();
        obs.disconnect();
      }
    });
  }, {threshold:0.3});
  obs.observe(svgEl);
}

  for(const country in cityRegistry){
    const found = cityRegistry[country].find(c=>c.name===cityName);
    if(found) return Number(found.cost||0);
  }
  return 0;
}
function findCityCountry(cityName){
  for(const country in cityRegistry){
    if(cityRegistry[country].some(c=>c.name===cityName)) return country;
  }
  return null;
}

function routeCountries(route){
  const set = new Set();
  route.dayPlan.forEach(d=>{
    const name = (d.city||'').trim();
    if(!name) return;
    const regCountry = findCityCountry(name);
    if(regCountry){ set.add(regCountry); return; }
    const mapped = correctCountryFor(name);
    if(mapped) set.add(mapped);
  });
  return Array.from(set);
}

/* ---------- COMPUTE ---------- */
function computeRoute(route){
  const roadTotal = Number(route.road.km||0) * Number(route.road.pricePerKm||0);
  const parkingTotal = route.parkingSelected.reduce((s,n)=>s+parkingCost(n),0);
  const guidesTotal = route.excursionSelected.reduce((s,n)=>s+guideCost(n),0);
  const escortTotal = Number(route.escortRate||0) * Number(route.days||0);
  const additionalGroupTotal = route.additional.filter(it=>it.enabled!==false && it.scope!=='person').reduce((s,it)=>s+Number(it.cost||0),0);
  const additionalPersonTotal = route.additional.filter(it=>it.enabled!==false && it.scope==='person').reduce((s,it)=>s+Number(it.cost||0),0);
  const roomCostTotal = route.hotels.reduce((s,h)=>s+Number(h.cost||0),0);
  const cityTaxTotal = route.hotels.reduce((s,h)=>s+Number(h.citytax||0),0);
  const hotelsTotal = roomCostTotal + cityTaxTotal;
  // Сітітакс НЕ входить у пул собівартості, що ділиться на групу — він покривається окремо
  // через обов'язковий платіж (див. mandatoryFeeInfo), щоб уникнути подвійного нарахування.
  const personTotal = additionalPersonTotal + roomCostTotal;
  const groupTotal = roadTotal + parkingTotal + guidesTotal + escortTotal + additionalGroupTotal;

  return {roadTotal,parkingTotal,guidesTotal,escortTotal,additionalGroupTotal,roomCostTotal,cityTaxTotal,hotelsTotal,groupTotal,personTotal};
}

// Обов'язковий платіж компанії: days * ставка (за замовчуванням 4,98 €/день/особу).
// Реальний сітітакс (з розділу «Готелі») зазвичай менший за цю суму — різницю ("hidden")
// приховують у базовій ціні (знижують її), щоб підсумкова ціна на особу лишалась незмінною
// й дорівнювала: базова ціна (без сітітаксу) + реальний сітітакс.
// Можна вимкнути вручну (route.mandatoryFeeEnabled=false) для замовних груп, де
// турсервіс/сітітакс уже врахований іншим сценарієм — тоді механізм повністю не діє.
function mandatoryFeeInfo(route, r){
  const days = Math.max(0, Number(route.days)||0);
  const cityTax = r.cityTaxTotal||0;
  if(route.mandatoryFeeEnabled===false){
    return {days, rate:0, fee:0, cityTax, hidden:0};
  }
  const rate = Number(route.cityTaxDailyRate)||0;
  const fee = days * rate;
  const hidden = fee - cityTax; // додатне — базову ціну зменшуємо; від'ємне — збільшуємо
  return {days, rate, fee, cityTax, hidden};
}

// Разом на особу з урахуванням обов'язкового платежу: базова (знижена на hidden) + платіж.
// Математично дорівнює corePrice + реальний сітітакс — платіж лише перерозподіляє суму
// між рядками "база" і "обов'язковий платіж" для чека/документів.
function withMandatoryFee(corePrice, mf){
  const loweredBase = corePrice - mf.hidden;
  const total = loweredBase + mf.fee;
  return {loweredBase, fee: mf.fee, total};
}

function priceForCounts(groupTotal, personTotal, P, F, profit, agency){
  const T = P + F;
  const base = (P>0?groupTotal/P:0) + (P>0?personTotal*T/P:0);
  return base + Number(profit||0) + Number(agency||0);
}

const GROUP_SIZE_OPTIONS = [30,35,40,45,50,55,60];
const MIN_GROUP_SIZE = 40; // мінімальна група, під яку орієнтовно рахуємо ціну (за системою 15+1)

// Знаходить найближчий до обраного повзунком розміру групи стовпчик серед фіксованих
// GROUP_SIZE_OPTIONS — саме він підсвічується в таблицях нижче.
function nearestGroupSizeOption(target){
  return GROUP_SIZE_OPTIONS.reduce((best,cur)=>Math.abs(cur-target)<Math.abs(best-target)?cur:best, GROUP_SIZE_OPTIONS[0]);
}

function roundToStep(n, step){
  step = step||5;
  return Math.round(n/step)*step;
}

// Тур-ціна "до комісії агента" (собівартість + комісія оператора + обов'язковий платіж),
// на базі якої підбирається щабель % комісії агента.
function agencyCostReference(route){
  const r = computeRoute(route);
  const size = Math.max(1, Math.floor(route.baseGroup.size)||30);
  const corePrice = priceForCounts(r.groupTotal, r.personTotal, size, 0, route.profit, 0);
  const mf = mandatoryFeeInfo(route, r);
  return withMandatoryFee(corePrice, mf).total;
}

// Комісія агента: % від ціни туру, за замовчуванням 10% — редагується вручну під конкретний
// тур/агента. Сума завжди округлюється до найближчих 5 €, мінімум 25 €/особу.
function applyAgencyPercent(route){
  const ref = agencyCostReference(route);
  const pct = Number(route.agencyPercent)||0;
  const raw = ref*pct/100;
  route.agency = Math.max(25, roundToStep(raw,5));
}

function systemRatio(route){
  const s = route.system;
  if(s.type==='10+1') return {unit:10, free:1};
  if(s.type==='12+1') return {unit:12, free:1};
  if(s.type==='15+1') return {unit:15, free:1};
  return {unit: Math.max(1,Number(s.customPaying)||1), free: Math.max(0,Number(s.customFree)||0)};
}

function standardSizeTable(route){
  const r = computeRoute(route);
  const mf = mandatoryFeeInfo(route, r);
  const cells = GROUP_SIZE_OPTIONS.map(size=>{
    const corePrice = priceForCounts(r.groupTotal, r.personTotal, size, 0, route.profit, route.agency);
    return {size, corePrice, ...withMandatoryFee(corePrice, mf)};

  const highlightSize = nearestGroupSizeOption(route.headlineGroupSize||MIN_GROUP_SIZE);
  const cls = size => size===highlightSize ? ' class="col-min-group"' : '';

  `;
}

function systemSizeTable(route){
  const r = computeRoute(route);
  const mf = mandatoryFeeInfo(route, r);
  const s = route.system;
  const cls = size => size===nearestGroupSizeOption(route.headlineGroupSize||MIN_GROUP_SIZE) ? ' class="col-min-group"' : '';
  if(s.type==='custom'){
    const P = Math.max(0, Number(s.customPaying)||0);
    const F = Math.max(0, Number(s.customFree)||0);
    const corePrice = priceForCounts(r.groupTotal, r.personTotal, P, F, route.profit, route.agency);
    const priced = withMandatoryFee(corePrice, mf);
    return `
      <table class="size-table">
        <thead><tr><th>Оплачуваних</th><th>Безкоштовних</th><th>Реальна ціна</th><th>Ціна з корекцією</th><th>В продаж: ціна з корекцією+обов'язковий платіж</th></tr></thead>
        <tbody><tr class="price-row"><td>${P}</td><td>${F}</td><td>${fmtBoth(corePrice)}</td><td>${fmtBoth(priced.loweredBase)}</td><td>${fmtSplitTotal(priced.loweredBase,priced.fee)}</td></tr></tbody>
      </table>
    `;
  }
  const {unit, free} = systemRatio(route);
  const cells = GROUP_SIZE_OPTIONS.map(size=>{
    const F = unit>0 ? Math.floor(size/unit)*free : 0;
    const corePrice = priceForCounts(r.groupTotal, r.personTotal, size, F, route.profit, route.agency);
    return {size, F, corePrice, ...withMandatoryFee(corePrice, mf)};
  });
  const highlightSize = nearestGroupSizeOption(route.headlineGroupSize||MIN_GROUP_SIZE);
  return `
    <table class="size-table">
      <thead><tr><th>Розмір групи</th>${cells.map(c=>`<th${cls(c.size)}>${c.size} чол</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Безкоштовних місць</td>${cells.map(c=>`<td${cls(c.size)}>${c.F}</td>`).join('')}</tr>
        <tr><td>Реальна ціна</td>${cells.map(c=>`<td${cls(c.size)}>${fmtBoth(c.corePrice)}</td>`).join('')}</tr>
        <tr><td>Ціна з корекцією</td>${cells.map(c=>`<td${cls(c.size)}>${fmtBoth(c.loweredBase)}</td>`).join('')}</tr>
        <tr class="price-row"><td>В продаж: ціна з корекцією+обов'язковий платіж</td>${cells.map(c=>`<td${cls(c.size)}>${fmtSplitTotal(c.loweredBase,c.fee)}</td>`).join('')}</tr>
      </tbody>
    </table>
    <div class="sub" style="margin-top:6px;">Виділена колонка (${highlightSize} чол) — синхронізовано з розміром групи, обраним повзунком у блоці ціни вище.</div>
  `;
}

// Прибуток туру (для обраного повзунком розміру групи) залежно від каналу продажу.
// "Стандартна" ціна вже включає слот під комісію агента (priceForCounts додає route.agency
// в саму ціну) — тож при продажу через агента ця частка йде ЗОВНІ (комісія), а при прямому
// продажу лишається в компанії. Витрати (постійні + маржинальні на людину) від каналу не залежать.
function computeChannelScenarios(route){
  const r = computeRoute(route);
  const mf = mandatoryFeeInfo(route, r);
  const hgs = Math.min(65, Math.max(25, Math.floor(route.headlineGroupSize)||MIN_GROUP_SIZE));
  const core = priceForCounts(r.groupTotal, r.personTotal, hgs, 0, route.profit, route.agency);
  const standard = withMandatoryFee(core, mf).total;
  const marginal = r.personTotal + r.cityTaxTotal;
  const totalCost = r.groupTotal + hgs*marginal;
  const netAgent = standard - Number(route.agency||0); // отримано з місця, проданого через агента
  const netDirect = standard; // отримано з місця, проданого напряму (комісія лишається у компанії)
  const agentHalf = Math.round(hgs/2);
  const directHalf = hgs - agentHalf;
  const revenueAllAgency = hgs*netAgent;
  const revenueHalfHalf = agentHalf*netAgent + directHalf*netDirect;
  const revenueAllDirect = hgs*netDirect;
  return {
    hgs, totalCost, agentHalf, directHalf,
    allAgency: {revenue: revenueAllAgency, profit: revenueAllAgency-totalCost},
    halfHalf: {revenue: revenueHalfHalf, profit: revenueHalfHalf-totalCost},
    allDirect: {revenue: revenueAllDirect, profit: revenueAllDirect-totalCost},
  };
}

function channelScenariosHtml(route){
  const c = computeChannelScenarios(route);
  return `
    <div class="channel-scenarios-box">
      <div class="channel-scenarios-title">Прибуток туру (${c.hgs} чол) залежно від каналу продажу</div>
      <div class="channel-scenarios-sub">Різниця між отриманими і витраченими коштами</div>
      <div class="channel-scenarios-row"><span>Уся група через агенції (100%)</span><strong>${fmt(c.allAgency.profit)}</strong></div>
      <div class="channel-scenarios-row"><span>50% агенції (${c.agentHalf} чол) / 50% прямі туристи (${c.directHalf} чол)</span><strong>${fmt(c.halfHalf.profit)}</strong></div>
      <div class="channel-scenarios-row"><span>Уся група напряму туристам (100%)</span><strong>${fmt(c.allDirect.profit)}</strong></div>
    </div>
  `;
}

/* ---------- ACTUAL SALES / BREAK-EVEN TRACKER ---------- */
// Постійні витрати (не залежать від фактичної к-сті учасників) і змінні витрати на 1 реального
// учасника (готель + реальний сітітакс) — на основі вже налаштованого маршруту.
function salesCostBasis(route){
  const r = computeRoute(route);
  return {fixed: r.groupTotal, marginal: r.personTotal + r.cityTaxTotal};
}

// Наростаючим підсумком: для кожного фактично проданого місця (в порядку внесення) —
// чиста виручка з нього, накопичений дохід, накопичена собівартість (постійні + n×змінні),
// накопичений прибуток/збиток. Точка беззбитковості — перше місце, на якому прибуток >= 0.
function computeSalesSummary(route){
  const {fixed, marginal} = salesCostBasis(route);
  let cumRevenue = 0;
  let breakEvenIndex = null;
  const rows = route.sales.map((s,i)=>{
    const n = i+1;
    const commission = s.viaAgent ? Number(s.agentCommission||0) : 0;
    const net = Number(s.price||0) - commission;
    cumRevenue += net;
    const cumCost = fixed + n*marginal;
    const profit = cumRevenue - cumCost;
    if(breakEvenIndex===null && profit>=0) breakEvenIndex = n;
    return {net, cumRevenue, cumCost, profit};
  });
  return {rows, fixed, marginal, breakEvenIndex, count: route.sales.length};
}

function salesRowHtml(s, i){
  return `
    <tr class="salesRow" data-i="${i}">
      <td style="font-family:'JetBrains Mono',monospace;color:#7a7360;">${i+1}</td>

      <td><input type="text" inputmode="decimal" class="salesPrice" data-i="${i}" value="${String(s.price).replace('.',',')}"></td>
      <td><input type="text" class="salesTourSer" data-i="${i}" value="${escapeHtml(s.tourSer||'')}" placeholder="Тур-Сер"></td>
      <td style="text-align:center;"><input type="checkbox" class="salesViaAgent itenabled" data-i="${i}" ${s.viaAgent?'checked':''} title="Продано через агента"></td>

      <td><button class="del-btn salesDelBtn" data-i="${i}">✕</button></td>

}

function salesSummaryHtml(route, summary){
  const {fixed, marginal, breakEvenIndex, count, rows} = summary;

        ? `<span style="color:var(--red);font-weight:700;">Беззбитковість ще не досягнута</span> — не вистачає ${fmt(-lastProfit)} доходу понад уже зібране.`
        : `Ще немає жодного проданого місця.`);
  return `
    <table class="breakdown">
      <tr><td>Постійні витрати туру (не залежать від к-сті учасників)</td><td>${fmt(fixed)}</td></tr>

      <tr><td>Собівартість на ${count} чол</td><td>${fmt(fixed+count*marginal)}</td></tr>

// Розбирає масив-масивів (рядки з клітинками) з файлу «Загальний документ» OneBox:
// шукає рядок заголовків за «номер заявки», потім колонки «тариф», «тур.збір», «комісія»,
// «до сплати». Ціна на людину = До сплати + Комісія (реконструює повну суму до вирахування
// комісії агента) — якщо «До сплати» відсутнє, підстраховується сумою Тариф+Тур.збір.
function parseOneBoxAOA(grid){
  if(!grid || !grid.length) return {rows:[], error:'Порожній файл.'};
  let headerIdx = -1, header = null;
  for(let i=0;i<Math.min(grid.length,6);i++){
    const low = (grid[i]||[]).map(c=>String(c==null?'':c).toLowerCase());
    if(low.some(c=>c.includes('номер заявки'))){ headerIdx=i; header=low; break; }
  }
  if(headerIdx===-1){
    return {rows:[], error:'Не знайшов рядок заголовків («Номер заявки») — переконайтесь, що це файл «Загальний документ» з OneBox.'};
  }
  const findCol = (...names) => header.findIndex(h=>names.some(n=>h.includes(n)));
  const idxApp = findCol('номер заявки');
  const idxTariff = findCol('тариф');
  const idxTourFee = findCol('тур.збір','тур збір');
  const idxCommission = findCol('комісія');
  const idxDoSplaty = findCol('до сплати');
  const num = s => { const n = Number(String(s==null?'':s).replace(',','.').replace(/[^\d.\-]/g,'')); return isFinite(n) ? n : null; };
  const rows = [];
  for(let i=headerIdx+1;i<grid.length;i++){
    const cells = grid[i]||[];
    if(!cells.length) continue;
    const appNum = idxApp>=0 ? String(cells[idxApp]==null?'':cells[idxApp]).trim().replace(/^#/,'') : '';
    const tariff = idxTariff>=0 ? num(cells[idxTariff]) : null;
    if(!appNum || tariff===null) continue;
    const tourfee = idxTourFee>=0 ? (num(cells[idxTourFee])||0) : 0;
    const commission = idxCommission>=0 ? (num(cells[idxCommission])||0) : 0;
    const dosplaty = idxDoSplaty>=0 ? num(cells[idxDoSplaty]) : null;
    const gross = dosplaty!==null ? round2(dosplaty+commission) : round2(tariff+tourfee);
    rows.push({label: appNum, price: gross, tourSer:'', viaAgent: commission>0, agentCommission: commission});
  }
  return {rows, error: rows.length ? null : 'Не вдалось розпізнати жодного рядка з тарифом у файлі.'};
}

// OneBox видає ".xls", який насправді є HTML-таблицею (не бінарний Excel) — розбираємо як HTML.
function parseOneBoxHtml(htmlText){
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const table = doc.querySelector('table');
  if(!table) return {rows:[], error:'У файлі не знайдено таблицю.'};
  const grid = Array.from(table.querySelectorAll('tr')).map(tr=>
    Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.replace(/\s+/g,' ').trim())
  );
  return parseOneBoxAOA(grid);
}

// Підвантажує SheetJS з CDN лише якщо реально трапиться бінарний .xlsx (на випадок, якщо
// OneBox колись почне віддавати справжній Excel, а не HTML під розширенням .xls).
let sheetJsLoadPromise = null;
function ensureSheetJsLoaded(){
  if(window.XLSX) return Promise.resolve();
  if(sheetJsLoadPromise) return sheetJsLoadPromise;
  sheetJsLoadPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('не вдалось завантажити бібліотеку для читання xlsx'));
    document.head.appendChild(s);
  });
  return sheetJsLoadPromise;
}

async function handleOneBoxFile(file){
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0,2));
  const isZip = head[0]===0x50 && head[1]===0x4B; // "PK" підпис — справжній бінарний .xlsx
  if(isZip){
    await ensureSheetJsLoaded();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    return parseOneBoxAOA(aoa);
  }
  const text = new TextDecoder('utf-8').decode(buf);
  if(/<table/i.test(text)){
    return parseOneBoxHtml(text);
  }
  // резервний варіант: звичайний CSV/TSV текст
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  const sep = lines[0] && lines[0].includes('\t') ? '\t' : ',';
  const grid = lines.map(l=>l.split(sep));
  return parseOneBoxAOA(grid);
}

function refreshSalesComputed(route){
  const summary = computeSalesSummary(route);
  summary.rows.forEach((row,i)=>{
    const el = document.getElementById(`salesRowCum-${i}`);
    if(el){
      el.textContent = fmt(row.profit);
      el.style.color = row.profit>=0 ? 'var(--teal-deep)' : 'var(--red)';
    }
    const tr = document.querySelector(`.salesRow[data-i="${i}"]`);
    if(tr) tr.style.background = (summary.breakEvenIndex!==null && i+1===summary.breakEvenIndex) ? 'var(--gold-dim)' : '';
  });
  const summaryEl = document.getElementById('salesSummaryBox');
  if(summaryEl) summaryEl.innerHTML = salesSummaryHtml(route, summary);
  updateTabDirtyDot();
}

function wireSalesRowEvents(route){
  const fileInput = document.getElementById('oneboxFileInput');
  if(fileInput) fileInput.addEventListener('change', async e=>{
    const file = e.target.files[0];
    const msg = document.getElementById('oneboxImportMsg');
    if(!file) return;
    if(msg){ msg.textContent = 'Обробляю файл...'; msg.style.color = '#9a927a'; }
    try{
      const {rows, error} = await handleOneBoxFile(file);
      if(error){
        if(msg){ msg.textContent = error; msg.style.color = 'var(--red)'; }
        return;
      }
      rows.forEach(r=>route.sales.push(r));
      if(msg){ msg.textContent = `Додано ${rows.length} рядків.`; msg.style.color = 'var(--teal-deep)'; }
      renderRouteBody();
    }catch(err){
      if(msg){ msg.textContent = 'Помилка обробки файлу: '+err.message; msg.style.color = 'var(--red)'; }
    }
  });
  document.querySelectorAll('.salesLabel').forEach(inp=>inp.addEventListener('input', e=>{
    route.sales[Number(e.target.dataset.i)].label = e.target.value;
  }));
  document.querySelectorAll('.salesPrice').forEach(inp=>inp.addEventListener('input', e=>{
    route.sales[Number(e.target.dataset.i)].price = Number(e.target.value.replace(',','.'))||0;
    refreshSalesComputed(route);
  }));
  document.querySelectorAll('.salesTourSer').forEach(inp=>inp.addEventListener('input', e=>{
    route.sales[Number(e.target.dataset.i)].tourSer = e.target.value;
  }));
  document.querySelectorAll('.salesViaAgent').forEach(cb=>cb.addEventListener('change', e=>{
    const i = Number(e.target.dataset.i);
    route.sales[i].viaAgent = e.target.checked;
    if(e.target.checked && !route.sales[i].agentCommission) route.sales[i].agentCommission = route.agency;
    const commInp = document.querySelector(`.salesCommission[data-i="${i}"]`);
    if(commInp){
      commInp.disabled = !e.target.checked;
      commInp.value = String(route.sales[i].agentCommission).replace('.',',');
    }
    refreshSalesComputed(route);
  }));
  document.querySelectorAll('.salesCommission').forEach(inp=>inp.addEventListener('input', e=>{
    route.sales[Number(e.target.dataset.i)].agentCommission = Number(e.target.value.replace(',','.'))||0;
    refreshSalesComputed(route);
  }));
  document.querySelectorAll('.salesDelBtn').forEach(btn=>btn.addEventListener('click', e=>{
    route.sales.splice(Number(e.target.dataset.i),1);
    renderRouteBody();
  }));
  const addBtn = document.getElementById('salesAddRow');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    route.sales.push({label:'', price: 0, tourSer:'', viaAgent:false, agentCommission: route.agency});
    renderRouteBody();
  });
}

/* ---------- BASE (BREAK-EVEN) GROUP OF FIXED SIZE ---------- */
function baseGroupSystemFree(size, systemType){
  const map = {'10+1':{unit:10,free:1}, '12+1':{unit:12,free:1}, '15+1':{unit:15,free:1}};
  const cfg = map[systemType];
  if(!cfg) return 0;
  const block = cfg.unit + cfg.free;
  if(block<=0) return 0;
  return Math.floor(size/block)*cfg.free;
}

function computeBaseGroup(route){
  const r = computeRoute(route);
  const bg = route.baseGroup;
  const size = Math.max(0, Math.floor(bg.size)||0);
  const systemFree = baseGroupSystemFree(size, bg.system);
  const manualFree = Math.max(0, Math.floor(bg.extraFree)||0);
  const totalFree = Math.min(size, systemFree + manualFree);
  let remaining = size - totalFree;

  const discountRows = [];
  let denomExtra = 0;
  let anyClamped = false;
  bg.discounts.forEach(d=>{
    const requested = Math.max(0, Math.floor(d.count)||0);
    const cnt = Math.min(requested, remaining);
    if(cnt < requested) anyClamped = true;
    remaining -= cnt;
    const pct = Math.max(0, Math.min(100, Number(d.percent)||0));
    const factor = 1 - pct/100;
    denomExtra += cnt*factor;
    discountRows.push({cnt, pct, requested});
  });

  const fullPayers = Math.max(0, remaining);
  const denom = fullPayers + denomExtra;
  const totalCost = r.groupTotal + r.personTotal*size;
  const fullPrice = denom>0 ? totalCost/denom : 0;

  return {
    size, systemFree, manualFree, totalFree, discountRows, anyClamped,
    fullPayers, denom, totalCost, fullPrice,
    personTotal: r.personTotal, groupTotal: r.groupTotal, cityTaxTotal: r.cityTaxTotal,
  };
}

function baseGroupDiscountRows(route){
  return route.baseGroup.discounts.map((d,i)=>`
    <tr>
      <td><input type="text" inputmode="numeric" class="bgDiscCount" data-i="${i}" value="${d.count}"></td>
      <td><input type="text" inputmode="decimal" class="bgDiscPercent" data-i="${i}" value="${String(d.percent).replace('.',',')}"></td>
      <td><button class="del-btn bgDiscDel" data-i="${i}">✕</button></td>
    </tr>`).join('') || `<tr><td colspan="3" style="color:#9a927a;font-size:12.5px;">Знижкових категорій ще немає</td></tr>`;
}

function baseGroupExtraTable(route, calc){
  const bg = route.baseGroup;
  const mf = mandatoryFeeInfo(route, {cityTaxTotal: calc.cityTaxTotal});
  const priced = withMandatoryFee(calc.fullPrice, mf);
  const realPersonCost = calc.personTotal + calc.cityTaxTotal; // додатковий учасник теж споживає готель і реальний сітітакс
  const extraPrice = (bg.extraPrice!==null && bg.extraPrice!==undefined) ? Number(bg.extraPrice) : priced.total;
  const profitPerHead = extraPrice - realPersonCost;
  const adds = [1,2,3,5,8,10,15,20];
  const cells = adds.map(add=>({size: calc.size+add, extraCount: add, profit: profitPerHead*add}));
  return `
    <table class="size-table">
      <thead><tr><th>Розмір групи</th>${cells.map(c=>`<th>${c.size} чол</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Понадпланових</td>${cells.map(c=>`<td>${c.extraCount}</td>`).join('')}</tr>
        <tr class="price-row"><td>Додатковий прибуток</td>${cells.map(c=>`<td>${fmt(c.profit)}</td>`).join('')}</tr>
      </tbody>
    </table>
  `;
}

// Список того, що входить у вартість туру — на основі реально активних складових маршруту.
// KPI навмисно виключено зі списку — це внутрішня стаття компанії, не клієнтська послуга.
function includedItemsList(route){
  const items = [];
  if(Number(route.road.km)>0) items.push('Транспортне обслуговування (автобус, паркування)');
  if(route.excursionSelected.length>0) items.push('Послуги гідів/екскурсоводів за програмою');
  if(Number(route.escortRate)>0) items.push('Супровід керівника групи');
  if(route.hotels.length>0) items.push(`Проживання в готелях (${route.hotels.length} ноч.)`);
  if(Number(route.cityTaxDailyRate)>0 && Number(route.days)>0) items.push('Курортний збір (сітітакс) у готелях');
  route.additional.forEach(it=>{
    if(it.enabled!==false && it.name && it.name.trim().toLowerCase()!=='kpi'){
      items.push(it.name);
    }
  });
  return items;
}

function buildRouteSummaryText(route){
  const r = computeRoute(route);
  const mf = mandatoryFeeInfo(route, r);
  const lines = [];
  lines.push(`Маршрут: ${route.name}`);
  lines.push(`К-ть днів: ${route.days}`);
  lines.push('');
  lines.push('План по днях:');
  route.dayPlan.forEach((d,i)=>{
    const isLast = i===route.dayPlan.length-1;
    const night = isLast ? '' : (d.nightType==='transfer' ? ' — нічний переїзд' : ' — готель');
    lines.push(`  День ${i+1}: ${d.city || '—'}${night}`);
  });
  lines.push('');
  lines.push('Ціна на особу (звичайна група, без безкоштовних місць):');
  GROUP_SIZE_OPTIONS.forEach(size=>{
    const corePrice = priceForCounts(r.groupTotal, r.personTotal, size, 0, route.profit, route.agency);
    const priced = withMandatoryFee(corePrice, mf);
    lines.push(`  ${size} чол: ${fmt(priced.total)} (реальна ${fmt(corePrice)}, з корекцією ${fmt(priced.loweredBase)}, обов'язк. платіж ${fmt(priced.fee)})`);
  });
  const {unit, free} = systemRatio(route);
  if(route.system.type!=='custom'){
    lines.push('');
    lines.push(`Ціна на особу (система ${route.system.type}):`);
    GROUP_SIZE_OPTIONS.forEach(size=>{
      const F = unit>0 ? Math.floor(size/unit)*free : 0;
      const corePrice = priceForCounts(r.groupTotal, r.personTotal, size, F, route.profit, route.agency);
      const priced = withMandatoryFee(corePrice, mf);
      lines.push(`  ${size} чол (${F} безкошт.): ${fmt(priced.total)}`);
    });
  } else {
    const P = Math.max(0,Number(route.system.customPaying)||0);
    const F = Math.max(0,Number(route.system.customFree)||0);
    const corePrice = priceForCounts(r.groupTotal, r.personTotal, P, F, route.profit, route.agency);
    const priced = withMandatoryFee(corePrice, mf);
    lines.push('');
    lines.push(`Ціна на особу (довільна система, ${P} оплачуваних + ${F} безкоштовних): ${fmt(priced.total)}`);
  }
  const included = includedItemsList(route);
  if(included.length){
    lines.push('');
    lines.push('Що входить у вартість туру:');
    included.forEach(item=>lines.push(`  • ${item}`));
  }
  return lines.join('\n');
}

function buildRouteSummaryShort(route){
  const r = computeRoute(route);
  const mf = mandatoryFeeInfo(route, r);
  const lines = [];
  lines.push(`Маршрут: ${route.name} (${route.days} дн.)`);
  route.dayPlan.forEach((d,i)=>{
    const isLast = i===route.dayPlan.length-1;
    const night = isLast ? '' : (d.nightType==='transfer' ? ' — переїзд' : ' — готель');
    lines.push(`Д${i+1}: ${d.city || '—'}${night}`);
  });
  const midSize = GROUP_SIZE_OPTIONS[Math.floor(GROUP_SIZE_OPTIONS.length/2)];
  const corePrice = priceForCounts(r.groupTotal, r.personTotal, midSize, 0, route.profit, route.agency);
  const priced = withMandatoryFee(corePrice, mf);
  lines.push(`Ціна/особу (${midSize} чол): ${fmt(priced.total)}`);
  return lines.join('\n');
}

function printRoute(route){
  const summary = buildRouteSummaryText(route);

    .split('\nЩо входить у вартість туру:')[0]

  const included = includedItemsList(route);
  const win = window.open('', '_blank');
  if(!win) return;
  win.document.write(`<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>${escapeHtml(route.name)}</title>

      h1{font-size:22px;margin:0 0 4px;}

    </style></head><body>

  win.document.close();

function shareRoute(route, channel){
  if(channel==='viber'){
    const short = buildRouteSummaryShort(route);
    window.open(`viber://forward?text=${encodeURIComponent(short)}`, '_blank');
    return;
  }
  const summary = buildRouteSummaryText(route);
  const encoded = encodeURIComponent(summary);
  if(channel==='email'){
    window.open(`mailto:?subject=${encodeURIComponent('Маршрут: '+route.name)}&body=${encoded}`, '_blank');
  } else if(channel==='telegram'){
    window.open(`https://t.me/share/url?url=&text=${encoded}`, '_blank');
  } else if(channel==='whatsapp'){
    window.open(`https://wa.me/?text=${encoded}`, '_blank');
  }
}
