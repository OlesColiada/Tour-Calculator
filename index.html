<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Калькулятор вартості туру</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --ink:#1c2b2e;
  --paper:#f1ede2;
  --paper-dim:#e7e1d1;
  --teal:#0f4c4c;
  --teal-deep:#0a3535;
  --gold:#c69a2e;
  --gold-dim:#e4c877;
  --line:#c9c1a8;
  --red:#a3402f;
  --white:#fffdf8;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:0 0 80px 0;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

header{background:var(--teal-deep);color:var(--white);padding:36px 0 26px 0;border-bottom:4px solid var(--gold);}
header .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
.brand-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo-badge{background:var(--white);border-radius:10px;padding:8px 14px;display:flex;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.2);}
.logo-badge img{height:52px;width:auto;display:block;}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:34px;margin:0;letter-spacing:.2px;}
header p{margin:6px 0 0 0;color:#cfe3df;font-size:14px;letter-spacing:.3px;}
.stamp{font-family:'JetBrains Mono',monospace;font-size:12px;border:1.5px solid var(--gold-dim);color:var(--gold-dim);padding:6px 12px;border-radius:2px;transform:rotate(-2deg);letter-spacing:1px;}
.storage-note{font-size:11.5px;color:#9fb; opacity:.75;margin-top:4px;}

.tabbar{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 0 0;align-items:center;}
.tab{position:relative;background:var(--white);border:1.5px solid var(--line);border-radius:3px 10px 10px 3px;padding:9px 34px 9px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s ease;}
.tab::before{content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);}
.tab.active{background:var(--teal);color:var(--white);border-color:var(--teal-deep);box-shadow:2px 3px 0 var(--gold);}
.tab.active::before{border-color:var(--teal-deep);background:var(--gold);}
.tab .rm{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55;line-height:1;}
.tab .rm:hover{opacity:1;color:var(--red);}
.tab input{background:transparent;border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px;color:inherit;width:auto;min-width:40px;}
.addtab{border:1.5px dashed var(--line);background:transparent;color:var(--teal);border-radius:8px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;}
.addtab:hover{background:var(--paper-dim);}

.save-bar{display:flex;gap:10px;align-items:center;margin:16px 0 0 0;}
.saved-panel{background:var(--white);border:1px solid var(--line);border-radius:4px;margin-top:14px;padding:18px 20px;}
table.saved-table{width:100%;border-collapse:collapse;font-size:13px;}
table.saved-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7a7360;padding:6px 8px;border-bottom:2px solid var(--line);font-weight:600;}
table.saved-table td{padding:8px;border-bottom:1px solid var(--paper-dim);vertical-align:middle;}
table.saved-table td.price{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--teal-deep);text-align:right;}
.saved-empty{font-size:13px;color:#9a927a;padding:8px 0;}
.saved-actions{display:flex;gap:6px;}
.saved-actions button{font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer;font-family:'JetBrains Mono',monospace;}
.btn-open{background:var(--teal);color:var(--white);border:none;}
.btn-open:hover{background:var(--teal-deep);}
.btn-del{background:transparent;border:1px solid var(--line);color:var(--red);}
.btn-del:hover{background:#f6e9e6;}

.card{background:var(--white);border:1px solid var(--line);border-radius:4px;margin-top:22px;padding:22px 24px;}
.card h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px 0;color:var(--teal-deep);}
.card .sub{font-size:12.5px;color:#6b6455;margin-bottom:16px;}

.meta-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:6px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7a7360;font-weight:600;}
.field input,.field select{border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:13.5px;background:var(--paper);color:var(--ink);width:160px;}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:1px;background:var(--white);}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}

table.items{width:100%;border-collapse:collapse;margin-top:10px;}
table.items th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7a7360;padding:6px 8px;border-bottom:2px solid var(--line);font-weight:600;}
table.items td{padding:5px 8px;border-bottom:1px solid var(--paper-dim);}
table.items input[type=text]{width:100%;border:1px solid transparent;background:transparent;font-family:'Inter',sans-serif;font-size:13.5px;padding:6px 6px;border-radius:3px;}
table.items input[type=text]:hover,table.items input[type=text]:focus{border-color:var(--line);background:var(--paper);}
table.items input[type=number]{width:110px;border:1px solid var(--line);background:var(--paper);font-family:'JetBrains Mono',monospace;font-size:13.5px;padding:6px 8px;border-radius:3px;text-align:right;}
table.items input[type=number]:focus{outline:2px solid var(--teal);outline-offset:0;background:var(--white);}
.del-btn{background:none;border:none;color:#a99;cursor:pointer;font-size:16px;padding:2px 8px;}
.del-btn:hover{color:var(--red);}
.add-row{margin-top:10px;background:none;border:1.5px dashed var(--line);color:var(--teal);padding:7px 14px;border-radius:5px;font-size:12.5px;font-family:'JetBrains Mono',monospace;cursor:pointer;}
.add-row:hover{background:var(--paper-dim);}
.grp-total{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--teal-deep);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:880px){.two-col{grid-template-columns:1fr;}}

/* city picker */
.picker-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
.city-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;max-height:180px;overflow-y:auto;padding:10px;background:var(--paper);border-radius:5px;border:1px solid var(--paper-dim);}
.city-chip-option{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:5px 10px 5px 8px;font-size:12.5px;cursor:pointer;user-select:none;}
.city-chip-option:hover{border-color:var(--teal);}
.city-chip-option.checked{background:var(--teal);color:var(--white);border-color:var(--teal-deep);}
.city-chip-option .cost{font-family:'JetBrains Mono',monospace;opacity:.75;font-size:11.5px;}
.cost-display{font-family:'JetBrains Mono',monospace;opacity:.8;font-size:11.5px;}
.edit-pencil{background:none;border:none;cursor:pointer;font-size:11px;opacity:.45;padding:0 2px;color:inherit;}
.edit-pencil:hover{opacity:1;}
.chip-cost-edit{width:64px;border:1px solid var(--gold);border-radius:3px;padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;background:var(--white);}
.city-chip-option.checked .chip-cost-edit{background:var(--white);color:var(--ink);}
.city-chip-option.checked .edit-pencil{color:var(--white);}
.add-city-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.add-city-form input{border:1px solid var(--line);border-radius:3px;padding:6px 9px;font-size:12.5px;font-family:'Inter',sans-serif;}
.add-city-form input.cost-inp{width:90px;font-family:'JetBrains Mono',monospace;text-align:right;}
.add-city-form input.name-inp{width:150px;}
.mini-btn{background:var(--teal);color:var(--white);border:none;border-radius:4px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;}
.mini-btn:hover{background:var(--teal-deep);}
.mini-btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line);}

.selected-strip{margin-top:10px;}
.sel-chip{display:inline-flex;align-items:center;gap:8px;background:var(--gold-dim);border-radius:14px;padding:6px 8px 6px 12px;font-size:12.5px;margin:0 8px 8px 0;}
.sel-chip .rm2{cursor:pointer;opacity:.6;font-weight:700;}
.sel-chip .rm2:hover{opacity:1;color:var(--red);}
.sel-chip select, .sel-chip input{border:1px solid var(--line);border-radius:3px;font-size:12px;padding:3px 5px;font-family:'JetBrains Mono',monospace;background:var(--white);}
.sel-chip input.days-inp{width:44px;text-align:center;}

.subtotal-line{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--paper-dim);font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--teal-deep);font-size:13.5px;}

.escort-block{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--paper-dim);}

.day-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.day-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:#7a7360;width:150px;flex-shrink:0;}
.day-city{flex:1;min-width:160px;border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-family:'Inter',sans-serif;font-size:13px;background:var(--paper);}
.day-city:focus{outline:2px solid var(--teal);outline-offset:1px;background:var(--white);}
.day-night{border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:12.5px;font-family:'Inter',sans-serif;background:var(--paper);width:190px;}
.day-timeline-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--paper-dim);border-radius:6px;padding:10px 6px;}

/* results */
.breakdown{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:13.5px;}
.breakdown td{padding:9px 6px;border-bottom:1px solid var(--paper-dim);}
.breakdown td:first-child{font-family:'Inter',sans-serif;color:var(--ink);}
.breakdown td:last-child{text-align:right;}
.breakdown tr.total td{font-weight:700;background:var(--gold-dim);color:var(--teal-deep);font-size:15px;}
.breakdown tr.sep td{border-top:2px solid var(--line);padding-top:14px;}

table.items select.itscope{border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-size:12px;font-family:'Inter',sans-serif;background:var(--paper);}
table.items tr.item-disabled{opacity:.45;}
table.items input.itenabled{width:16px;height:16px;cursor:pointer;}

.lock-banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--gold-dim);border:1px solid var(--gold);border-radius:5px;padding:12px 16px;margin-top:20px;font-size:13px;color:var(--teal-deep);}
.locked-overlay{pointer-events:none;opacity:.55;user-select:none;filter:grayscale(.2);}
.share-row{display:flex;gap:10px;flex-wrap:wrap;}

.size-table-wrap{overflow-x:auto;margin-top:8px;}
table.size-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:13px;min-width:560px;}
table.size-table th{background:var(--teal-deep);color:var(--white);padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;text-align:right;}
table.size-table th:first-child{text-align:left;}
table.size-table td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--paper-dim);}
table.size-table td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:600;color:var(--teal-deep);}
table.size-table tr.price-row td{font-weight:700;background:var(--gold-dim);color:var(--teal-deep);}

footer{text-align:center;color:#8a8368;font-size:12px;margin-top:40px;}
</style>
</head>

function sbHeaders(extra){

async function sbGet(path){

async function sbInsert(table, rows){

async function sbUpdate(table, matchQuery, patch){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${matchQuery}`, {
    method: 'PATCH',
    headers: sbHeaders({'Prefer':'return=minimal'}),
    body: JSON.stringify(patch),
  });
  if(!res.ok) throw new Error('Supabase UPDATE ' + res.status);
}
async function sbDelete(table, matchQuery){

}

async function saveCurrentRoute(){
  const route = getRoute(activeId);
  const computed = computeRoute(route);
  const price30 = priceForCounts(computed.groupTotal, computed.personTotal, 30, 0, route.profit, route.agency);
  const savedId = 's' + Date.now() + Math.floor(Math.random()*1000);
  const row = {saved_id: savedId, name: route.name, snapshot: snapshotRoute(route), price30, days: route.days};

function setDayCount(route, count){
  count = Math.max(0, Math.floor(Number(count)||0));
  const old = route.dayPlan;
  const next = [];
  for(let i=0;i<count;i++) next.push(old[i] || {city:'', nightType:'hotel'});
  route.dayPlan = next;
  route.days = count;
}

function nightTransfersCount(route){

function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  routes.forEach(r=>{
    const tab = document.createElement('div');
    tab.className = 'tab' + (r.id===activeId ? ' active' : '');
    tab.innerHTML = `<input type="text" value="${escapeHtml(r.name)}" data-id="${r.id}" class="tabname"/><span class="rm" data-id="${r.id}">✕</span>`;
    tab.addEventListener('click',(e)=>{
      if(e.target.classList.contains('rm')||e.target.classList.contains('tabname')) return;
      activeId = r.id; renderAll();
    });
    bar.appendChild(tab);
  });
  const addBtn = document.createElement('button');
  addBtn.className='addtab'; addBtn.textContent='+ Маршрут';
  addBtn.onclick = ()=>{
    const nr = newRoute('Маршрут ' + uid);
    routes.push(nr); activeId = nr.id; renderAll();
  };
  bar.appendChild(addBtn);
  bar.querySelectorAll('.tabname').forEach(inp=>{
    inp.addEventListener('input', e=>{ getRoute(Number(e.target.dataset.id)).name = e.target.value; });
    inp.addEventListener('click', e=>e.stopPropagation());
  });
  bar.querySelectorAll('.rm').forEach(x=>{
    x.addEventListener('click', e=>{
      e.stopPropagation();
      const id = Number(e.target.dataset.id);
      if(routes.length===1) return;
      routes = routes.filter(r=>r.id!==id);
      if(activeId===id) activeId = routes[0].id;
      renderAll();
    });
  });
}

function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function routeTimelineSVG(route){
  const days = route.dayPlan;
  const n = days.length;
  if(n===0) return '<div style="font-size:12.5px;color:#9a927a;">Візуалізація зʼявиться після додавання днів.</div>';
  const dayWidth = 120;
  const width = Math.max(560, (n-1)*dayWidth + 80);
  const height = 110;
  const y = 46;
  let svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">`;
  for(let i=0;i<n-1;i++){
    const x1 = 40+i*dayWidth, x2 = 40+(i+1)*dayWidth;
    const transfer = days[i].nightType==='transfer';
    svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${transfer?'#c69a2e':'#0f4c4c'}" stroke-width="3" ${transfer?'stroke-dasharray="7,6"':''}/>`;
    const midx = (x1+x2)/2;
    svg += `<text x="${midx}" y="${y-12}" font-size="10.5" text-anchor="middle" fill="${transfer?'#a3402f':'#0a3535'}" font-family="'JetBrains Mono',monospace">${transfer?'нічний переїзд':'готель'}</text>`;
  }
  days.forEach((d,i)=>{
    const x = 40+i*dayWidth;
    const isLast = i===n-1;
    svg += `<circle cx="${x}" cy="${y}" r="9" fill="${isLast?'#c69a2e':'#0f4c4c'}" stroke="#fffdf8" stroke-width="2"/>`;
    svg += `<text x="${x}" y="${y+26}" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2b2e" font-family="'Inter',sans-serif">${escapeXml(d.city || ('День '+(i+1)))}</text>`;
    svg += `<text x="${x}" y="${y+42}" font-size="10" text-anchor="middle" fill="#7a7360" font-family="'JetBrains Mono',monospace">День ${i+1}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

/* ---------- PARKING PICKER ---------- */
function parkingCost(cityName){
  for(const country in cityRegistry){
    const found = cityRegistry[country].find(c=>c.name===cityName);
    if(found) return Number(found.cost||0);
  }
  return 0;
}
function findCityCountry(cityName){
  for(const country in cityRegistry){
    if(cityRegistry[country].some(c=>c.name===cityName)) return country;
  }
  return null;
}

function routeCountries(route){
  const set = new Set();
  route.dayPlan.forEach(d=>{
    const name = (d.city||'').trim();
    if(!name) return;
    const regCountry = findCityCountry(name);
    if(regCountry){ set.add(regCountry); return; }
    const mapped = correctCountryFor(name);
    if(mapped) set.add(mapped);
  });
  return Array.from(set);
}

/* ---------- COMPUTE ---------- */
function computeRoute(route){
  const roadTotal = Number(route.road.km||0) * Number(route.road.pricePerKm||0);
  const parkingTotal = route.parkingSelected.reduce((s,n)=>s+parkingCost(n),0);
  const guidesTotal = route.excursionSelected.reduce((s,n)=>s+guideCost(n),0);
  const escortTotal = Number(route.escortRate||0) * Number(route.days||0);
  const additionalGroupTotal = route.additional.filter(it=>it.enabled!==false && it.scope!=='person').reduce((s,it)=>s+Number(it.cost||0),0);
  const additionalPersonTotal = route.additional.filter(it=>it.enabled!==false && it.scope==='person').reduce((s,it)=>s+Number(it.cost||0),0);
  const hotelsTotal = route.hotels.reduce((s,h)=>s+Number(h.cost||0)+Number(h.citytax||0),0);
  const personTotal = additionalPersonTotal + hotelsTotal;
  const groupTotal = roadTotal + parkingTotal + guidesTotal + escortTotal + additionalGroupTotal;

  return {roadTotal,parkingTotal,guidesTotal,escortTotal,additionalGroupTotal,hotelsTotal,groupTotal,personTotal};
}

function priceForCounts(groupTotal, personTotal, P, F, profit, agency){
  const T = P + F;
  const base = (P>0?groupTotal/P:0) + (P>0?personTotal*T/P:0);
  return base + Number(profit||0) + Number(agency||0);
}

const GROUP_SIZE_OPTIONS = [30,35,40,45,50,55,60];

function systemRatio(route){
  const s = route.system;
  if(s.type==='10+1') return {unit:10, free:1};
  if(s.type==='12+1') return {unit:12, free:1};
  if(s.type==='15+1') return {unit:15, free:1};
  return {unit: Math.max(1,Number(s.customPaying)||1), free: Math.max(0,Number(s.customFree)||0)};
}

function standardSizeTable(route){
  const r = computeRoute(route);
  const cells = GROUP_SIZE_OPTIONS.map(size=>({size, price: priceForCounts(r.groupTotal, r.personTotal, size, 0, route.profit, route.agency)}));
  return `
    <table class="size-table">
      <thead><tr><th>Розмір групи</th>${cells.map(c=>`<th>${c.size} чол</th>`).join('')}</tr></thead>
      <tbody><tr class="price-row"><td>Ціна на особу</td>${cells.map(c=>`<td>${fmt(c.price)}</td>`).join('')}</tr></tbody>
    </table>
  `;
}

function systemSizeTable(route){
  const r = computeRoute(route);
  const s = route.system;
  if(s.type==='custom'){
    const P = Math.max(0, Number(s.customPaying)||0);
    const F = Math.max(0, Number(s.customFree)||0);
    const price = priceForCounts(r.groupTotal, r.personTotal, P, F, route.profit, route.agency);
    return `
      <table class="size-table">
        <thead><tr><th>Оплачуваних</th><th>Безкоштовних</th><th>Ціна на особу</th></tr></thead>
        <tbody><tr class="price-row"><td>${P}</td><td>${F}</td><td>${fmt(price)}</td></tr></tbody>
      </table>
    `;
  }
  const {unit, free} = systemRatio(route);
  const cells = GROUP_SIZE_OPTIONS.map(size=>{
    const F = unit>0 ? Math.floor(size/unit)*free : 0;
    return {size, F, price: priceForCounts(r.groupTotal, r.personTotal, size, F, route.profit, route.agency)};
  });
  return `
    <table class="size-table">
      <thead><tr><th>Розмір групи</th>${cells.map(c=>`<th>${c.size} чол</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Безкоштовних місць</td>${cells.map(c=>`<td>${c.F}</td>`).join('')}</tr>
        <tr class="price-row"><td>Ціна на особу</td>${cells.map(c=>`<td>${fmt(c.price)}</td>`).join('')}</tr>
      </tbody>
    </table>
  `;
}

/* ---------- PRINT & SHARE ---------- */
function buildRouteSummaryText(route){
  const r = computeRoute(route);
  const lines = [];
  lines.push(`Маршрут: ${route.name}`);
  lines.push(`К-ть днів: ${route.days}`);
  lines.push('');
  lines.push('План по днях:');
  route.dayPlan.forEach((d,i)=>{
    const isLast = i===route.dayPlan.length-1;
    const night = isLast ? '' : (d.nightType==='transfer' ? ' — нічний переїзд' : ' — готель');
    lines.push(`  День ${i+1}: ${d.city || '—'}${night}`);
  });
  lines.push('');
  lines.push('Ціна на особу (звичайна група, без безкоштовних місць):');
  GROUP_SIZE_OPTIONS.forEach(size=>{
    const price = priceForCounts(r.groupTotal, r.personTotal, size, 0, route.profit, route.agency);
    lines.push(`  ${size} чол: ${fmt(price)}`);
  });
  const {unit, free} = systemRatio(route);
  if(route.system.type!=='custom'){
    lines.push('');
    lines.push(`Ціна на особу (система ${route.system.type}):`);
    GROUP_SIZE_OPTIONS.forEach(size=>{
      const F = unit>0 ? Math.floor(size/unit)*free : 0;
      const price = priceForCounts(r.groupTotal, r.personTotal, size, F, route.profit, route.agency);
      lines.push(`  ${size} чол (${F} безкошт.): ${fmt(price)}`);
    });
  } else {
    const P = Math.max(0,Number(route.system.customPaying)||0);
    const F = Math.max(0,Number(route.system.customFree)||0);
    const price = priceForCounts(r.groupTotal, r.personTotal, P, F, route.profit, route.agency);
    lines.push('');
    lines.push(`Ціна на особу (довільна система, ${P} оплачуваних + ${F} безкоштовних): ${fmt(price)}`);
  }
  return lines.join('\n');
}

function buildRouteSummaryShort(route){
  const r = computeRoute(route);
  const lines = [];
  lines.push(`Маршрут: ${route.name} (${route.days} дн.)`);
  route.dayPlan.forEach((d,i)=>{
    const isLast = i===route.dayPlan.length-1;
    const night = isLast ? '' : (d.nightType==='transfer' ? ' — переїзд' : ' — готель');
    lines.push(`Д${i+1}: ${d.city || '—'}${night}`);
  });
  const midSize = GROUP_SIZE_OPTIONS[Math.floor(GROUP_SIZE_OPTIONS.length/2)];
  const price = priceForCounts(r.groupTotal, r.personTotal, midSize, 0, route.profit, route.agency);
  lines.push(`Ціна/особу (${midSize} чол): ${fmt(price)}`);
  return lines.join('\n');
}

function printRoute(route){
  const summary = buildRouteSummaryText(route);
  const win = window.open('', '_blank');
  if(!win) return;
  win.document.write(`<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>${escapeHtml(route.name)}</title>
    <style>
      body{font-family:Georgia,serif;padding:40px;color:#1c2b2e;white-space:pre-wrap;line-height:1.6;font-size:14px;}
      h1{font-size:22px;border-bottom:2px solid #c69a2e;padding-bottom:10px;}
    </style></head><body><h1>${escapeHtml(route.name)}</h1><div>${escapeHtml(summary)}</div></body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(), 300);
}

function shareRoute(route, channel){
  if(channel==='viber'){
    const short = buildRouteSummaryShort(route);
    window.open(`viber://forward?text=${encodeURIComponent(short)}`, '_blank');
    return;
  }
  const summary = buildRouteSummaryText(route);
  const encoded = encodeURIComponent(summary);
  if(channel==='email'){
    window.open(`mailto:?subject=${encodeURIComponent('Маршрут: '+route.name)}&body=${encoded}`, '_blank');
  } else if(channel==='telegram'){
    window.open(`https://t.me/share/url?url=&text=${encoded}`, '_blank');
  } else if(channel==='whatsapp'){
    window.open(`https://wa.me/?text=${encoded}`, '_blank');
  }
}

      <div style="font-size:11.5px;color:#9a927a;margin-top:8px;">Viber має жорсткий ліміт довжини посилання, тому туди йде скорочений варіант (план по днях + одна ціна для прикладу). Email, Telegram, WhatsApp і друк отримують повний підсумок з усіма таблицями цін.</div>
    </div>
  `;

  wireEvents(route);
}

function wireEvents(route){
  const el = document.getElementById('routeBody');

  document.getElementById('daysInput').addEventListener('input', e=>{
    updateDayCount(route, e.target.value);
  });
  el.querySelectorAll('.day-city').forEach(inp=>{
    inp.addEventListener('input', e=>{
      route.dayPlan[Number(e.target.dataset.i)].city = e.target.value;
      updateDayTimeline(route);
    });
    inp.addEventListener('blur', ()=>renderRouteBody());
  });
  el.querySelectorAll('.day-night').forEach(sel=>sel.addEventListener('change', e=>{
    route.dayPlan[Number(e.target.dataset.i)].nightType = e.target.value;
    syncHotelsCount(route);
    updateDayTimeline(route);
  }));
  document.getElementById('roadKm').addEventListener('input', e=>{
    route.road.km = Number(e.target.value.replace(',','.'))||0;
    updateRoadTotal(route);
  });
  document.getElementById('roadPrice').addEventListener('input', e=>{
    route.road.pricePerKm = Number(e.target.value.replace(',','.'))||0;
    updateRoadTotal(route);
  });
  document.getElementById('escortRateSel').addEventListener('change', e=>{
    route.escortRate = Number(e.target.value)||0;
    updateEscortTotal(route);
  });

  // hotels
  wireHotelRowEvents(route);
  const hotelsAddBtn = document.getElementById('hotelsAddRow');
  if(hotelsAddBtn) hotelsAddBtn.addEventListener('click', ()=>{
    route.hotels.push({name:'Готель ' + (route.hotels.length+1), country: EURO_COUNTRIES[0], cost:0, citytax:0});
    renderRouteBody();
  });

  // additional cost items (with scope + opt-in)
  wireAdditionalRowEvents(route);
  const addRowBtn = document.getElementById('additionalAddRow');
  if(addRowBtn) addRowBtn.addEventListener('click', ()=>{
    route.additional.push({name:'Новий пункт', cost:0, scope:'group', enabled:true});
    renderRouteBody();
  });

  // parking
  const parkingSel = document.getElementById('parkingCountrySel');
  if(parkingSel) parkingSel.addEventListener('change', e=>{ route.parkingCountryView = e.target.value; editingCostKey=null; renderRouteBody(); });
  el.querySelectorAll('.city-label[data-mode="parking"]').forEach(label=>label.addEventListener('click', e=>{
    const city = label.dataset.city;
    const idx = route.parkingSelected.indexOf(city);
    if(idx>=0) route.parkingSelected.splice(idx,1); else route.parkingSelected.push(city);
    renderRouteBody();
  }));
  el.querySelectorAll('[data-remove-parking]').forEach(x=>x.addEventListener('click', e=>{
    const city = e.target.dataset.removeParking;
    route.parkingSelected = route.parkingSelected.filter(c=>c!==city);
    renderRouteBody();
  }));
  const parkingAddBtn = document.getElementById('parkingAddCityBtn');
  if(parkingAddBtn) parkingAddBtn.addEventListener('click', async ()=>{
    const nameInp = document.getElementById('parkingNewCity');
    const costInp = document.getElementById('parkingNewCost');
    const msg = document.getElementById('parkingAddMsg');
    const name = nameInp.value.trim();
    if(!name) return;
    const country = route.parkingCountryView;
    const correct = correctCountryFor(name);
    if(correct && correct!==country){
      msg.textContent = 'Вибери коректну країну';
      msg.style.display = 'block';
      return;
    }
    msg.style.display = 'none';
    if(!cityRegistry[country].some(c=>c.name===name)){
      await addCityToRegistry(country, name, Number(String(costInp.value).replace(',','.'))||0, 0);
    }
    if(!route.parkingSelected.includes(name)) route.parkingSelected.push(name);
    renderRouteBody();
  });

  // excursion guides (mirrors parking)
  const excursionSel = document.getElementById('excursionCountrySel');
  if(excursionSel) excursionSel.addEventListener('change', e=>{ route.excursionCountryView = e.target.value; editingCostKey=null; renderRouteBody(); });
  el.querySelectorAll('.city-label[data-mode="excursion"]').forEach(label=>label.addEventListener('click', e=>{
    const city = label.dataset.city;
    const idx = route.excursionSelected.indexOf(city);
    if(idx>=0) route.excursionSelected.splice(idx,1);
    else route.excursionSelected.push(city);
    renderRouteBody();
  }));
  el.querySelectorAll('[data-remove-excursion]').forEach(x=>x.addEventListener('click', e=>{
    const city = e.target.dataset.removeExcursion;
    route.excursionSelected = route.excursionSelected.filter(c=>c!==city);
    renderRouteBody();
  }));
  const excursionAddBtn = document.getElementById('excursionAddCityBtn');
  if(excursionAddBtn) excursionAddBtn.addEventListener('click', async ()=>{
    const nameInp = document.getElementById('excursionNewCity');
    const costInp = document.getElementById('excursionNewCost');
    const msg = document.getElementById('excursionAddMsg');
    const name = nameInp.value.trim();
    if(!name) return;
    const country = route.excursionCountryView;
    const correct = correctCountryFor(name);
    if(correct && correct!==country){
      msg.textContent = 'Вибери коректну країну';
      msg.style.display = 'block';
      return;
    }
    msg.style.display = 'none';
    if(!cityRegistry[country].some(c=>c.name===name)){
      await addCityToRegistry(country, name, 0, Number(String(costInp.value).replace(',','.'))||0);
    }
    if(!route.excursionSelected.includes(name)) route.excursionSelected.push(name);
    renderRouteBody();
  });

  // hidden cost-correction (pencil) — shared for parking + excursion
  el.querySelectorAll('.edit-pencil').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation();
    editingCostKey = btn.dataset.type + ':' + btn.dataset.city;
    renderRouteBody();
  }));
  el.querySelectorAll('.chip-cost-edit').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('input', e=>{
      e.stopPropagation();
      const type = e.target.dataset.type, city = e.target.dataset.city;
      const country = findCityCountry(city);
      if(!country) return;
      const entry = cityRegistry[country].find(c=>c.name===city);
      if(!entry) return;
      const val = Number(e.target.value.replace(',','.'))||0;
      if(type==='parking'){ entry.cost = val; updateParkingTotals(route); }
      else { entry.guideCost = val; updateExcursionTotals(route); }
    });
    inp.addEventListener('blur', async e=>{
      const type = e.target.dataset.type, city = e.target.dataset.city;
      const country = findCityCountry(city);
      if(country){
        const entry = cityRegistry[country].find(c=>c.name===city);
        if(entry){
          const field = type==='parking' ? 'cost' : 'guideCost';
          await updateCityField(entry, field, entry[field]);
        }
      }
      editingCostKey = null;
      renderRouteBody();
    });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') e.target.blur(); });
  });
  if(editingCostKey){
    const active = Array.from(el.querySelectorAll('.chip-cost-edit')).find(i=>i.dataset.type+':'+i.dataset.city===editingCostKey);
    if(active){ active.focus(); active.select(); }
  }

  wireResultsEvents(route);

  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn) unlockBtn.addEventListener('click', ()=>{
    route.locked = false;
    renderRouteBody();
  });
  const printBtn = document.getElementById('printRouteBtn');
  if(printBtn) printBtn.addEventListener('click', ()=>printRoute(route));
  const emailBtn = document.getElementById('emailShareBtn');
  if(emailBtn) emailBtn.addEventListener('click', ()=>shareRoute(route,'email'));
  const viberBtn = document.getElementById('viberShareBtn');
  if(viberBtn) viberBtn.addEventListener('click', ()=>shareRoute(route,'viber'));
  const telegramBtn = document.getElementById('telegramShareBtn');
  if(telegramBtn) telegramBtn.addEventListener('click', ()=>shareRoute(route,'telegram'));
  const whatsappBtn = document.getElementById('whatsappShareBtn');
  if(whatsappBtn) whatsappBtn.addEventListener('click', ()=>shareRoute(route,'whatsapp'));
}

function wireAdditionalRowEvents(route){
  document.querySelectorAll('.itenabled').forEach(cb=>cb.addEventListener('change', e=>{
    const i=Number(e.target.dataset.i);
    route.additional[i].enabled = e.target.checked;
    renderRouteBody();
  }));
  document.querySelectorAll('.itname').forEach(inp=>inp.addEventListener('input', e=>{
    const i=Number(e.target.dataset.i);
    route.additional[i].name = e.target.value;
  }));
  document.querySelectorAll('.itcost').forEach(inp=>inp.addEventListener('input', e=>{
    const i=Number(e.target.dataset.i);
    route.additional[i].cost = Number(e.target.value.replace(',','.'))||0;
    route.additional[i].autoSync = false;
    updateAdditionalTotals(route);
  }));
  document.querySelectorAll('.itscope').forEach(sel=>sel.addEventListener('change', e=>{
    const i=Number(e.target.dataset.i);
    route.additional[i].scope = e.target.value;
    updateAdditionalTotals(route);
  }));
  document.querySelectorAll('.del-btn').forEach(btn=>btn.addEventListener('click', e=>{
    route.additional.splice(Number(e.target.dataset.i),1);
    renderRouteBody();
  }));
}

function wireHotelRowEvents(route){
  document.querySelectorAll('.hotelname').forEach(inp=>inp.addEventListener('input', e=>{
    route.hotels[Number(e.target.dataset.i)].name = e.target.value;
  }));
  document.querySelectorAll('.hotelcountry').forEach(sel=>sel.addEventListener('change', e=>{
    route.hotels[Number(e.target.dataset.i)].country = e.target.value;
  }));
  document.querySelectorAll('.hotelcost').forEach(inp=>inp.addEventListener('input', e=>{
    route.hotels[Number(e.target.dataset.i)].cost = Number(e.target.value.replace(',','.'))||0;
    updateHotelsTotal(route);
  }));
  document.querySelectorAll('.hotelcitytax').forEach(inp=>inp.addEventListener('input', e=>{
    route.hotels[Number(e.target.dataset.i)].citytax = Number(e.target.value.replace(',','.'))||0;
    updateHotelsTotal(route);
  }));
  document.querySelectorAll('.hotel-del-btn').forEach(btn=>btn.addEventListener('click', e=>{
    route.hotels.splice(Number(e.target.dataset.i),1);
    renderRouteBody();
  }));
}

function countHotelNights(route){
  const n = route.dayPlan.length;
  if(n<2) return 0;
  return route.dayPlan.slice(0, n-1).filter(d=>d.nightType!=='transfer').length;
}

function syncHotelsCount(route){
  const target = countHotelNights(route);
  let changed = false;

  while(route.hotels.length < target){
    route.hotels.push({name:'Готель ' + (route.hotels.length+1), country: EURO_COUNTRIES[0], cost:0, citytax:0});
    changed = true;
  }
  while(route.hotels.length > target){
    const last = route.hotels[route.hotels.length-1];
    const untouched = Number(last.cost)===0 && Number(last.citytax)===0;
    if(!untouched) break; // don't silently delete data the user already entered
    route.hotels.pop();
    changed = true;
  }

  if(changed){
    const rowsEl = document.getElementById('hotelsRows');
    if(rowsEl){
      rowsEl.innerHTML = route.hotels.map((h,i)=>hotelRowHtml(h,i)).join('') || `<tr><td colspan="5" style="color:#9a927a;font-size:12.5px;">Готелів ще не додано</td></tr>`;
      wireHotelRowEvents(route);
    }
    updateHotelsTotal(route);
  }
}

function wireDayRowEvents(route){
  document.querySelectorAll('.day-city').forEach(inp=>{
    inp.addEventListener('input', e=>{
      route.dayPlan[Number(e.target.dataset.i)].city = e.target.value;
      updateDayTimeline(route);
    });
    inp.addEventListener('blur', ()=>renderRouteBody());
  });
  document.querySelectorAll('.day-night').forEach(sel=>sel.addEventListener('change', e=>{
    route.dayPlan[Number(e.target.dataset.i)].nightType = e.target.value;
    syncHotelsCount(route);
    updateDayTimeline(route);
  }));
}

function updateDayCount(route, val){
  setDayCount(route, val);
  const rowsEl = document.getElementById('dayRows');
  if(rowsEl){ rowsEl.innerHTML = dayPlanRows(route); wireDayRowEvents(route); }
  const escortDaysEl = document.getElementById('escortDaysDisplay');
  if(escortDaysEl) escortDaysEl.value = route.days;
  syncAutoAdditionalItems(route);
  syncHotelsCount(route);
  updateEscortTotal(route);
  updateDayTimeline(route);
}

function syncAutoAdditionalItems(route){
  let changed = false;
  route.additional.forEach(it=>{
    if(it.autoSync){ it.cost = route.days; changed = true; }
  });
  if(changed){
    const rowsEl = document.getElementById('additionalRows');
    if(rowsEl){
      rowsEl.innerHTML = route.additional.map((it,i)=>additionalRowHtml(it,i)).join('');
      wireAdditionalRowEvents(route);
    }
    updateAdditionalTotals(route);
  }
}

function updateDayTimeline(route){
  const wrap = document.getElementById('dayTimeline');
  if(wrap) wrap.innerHTML = routeTimelineSVG(route);
  const nt = document.getElementById('nightTransfersDisplay');
  if(nt) nt.value = nightTransfersCount(route);
  refreshResults();
}

function updateSizeTables(route){
  const std = document.getElementById('standardSizeTableWrap');
  if(std) std.innerHTML = standardSizeTable(route);
  const sys = document.getElementById('systemSizeTableWrap');
  if(sys) sys.innerHTML = systemSizeTable(route);
}

function updateHotelsTotal(route){
  const totalEl = document.getElementById('hotelsTotal');
  const total = route.hotels.reduce((s,h)=>s+Number(h.cost||0)+Number(h.citytax||0),0);
  if(totalEl) totalEl.textContent = fmt(total);
  refreshResults();
}

function updateAdditionalTotals(route){
  const groupEl = document.getElementById('additionalGroupTotal');
  const personEl = document.getElementById('additionalPersonTotal');
  const groupTotal = route.additional.filter(it=>it.enabled!==false && it.scope!=='person').reduce((s,it)=>s+Number(it.cost||0),0);
  const personTotal = route.additional.filter(it=>it.enabled!==false && it.scope==='person').reduce((s,it)=>s+Number(it.cost||0),0);
  if(groupEl) groupEl.textContent = fmt(groupTotal);
  if(personEl) personEl.textContent = fmt(personTotal);
  refreshResults();
}

function updateExcursionTotals(route){
  const totalEl = document.getElementById('excursionTotalValue');
  const total = route.excursionSelected.reduce((s,n)=>s+guideCost(n),0);
  if(totalEl) totalEl.textContent = fmt(total);
  const stripEl = document.getElementById('excursionSelectedStrip');
  if(stripEl){
    stripEl.innerHTML = buildExcursionSelectedChips(route);
    stripEl.querySelectorAll('[data-remove-excursion]').forEach(x=>x.addEventListener('click', e=>{
      const city = e.target.dataset.removeExcursion;
      route.excursionSelected = route.excursionSelected.filter(c=>c!==city);
      renderRouteBody();
    }));
  }
  refreshResults();
}

function updateEscortTotal(route){
  const disp = document.getElementById('escortTotalDisplay');
  if(disp) disp.value = fmt(Number(route.escortRate||0)*Number(route.days||0));
  refreshResults();
}

function updateParkingTotals(route){
  const totalEl = document.getElementById('parkingTotalValue');
  const total = route.parkingSelected.reduce((s,n)=>s+parkingCost(n),0);
  if(totalEl) totalEl.textContent = fmt(total);
  const stripEl = document.getElementById('parkingSelectedStrip');
  if(stripEl) stripEl.innerHTML = buildParkingSelectedChips(route);
  stripEl && stripEl.querySelectorAll('[data-remove-parking]').forEach(x=>x.addEventListener('click', e=>{
    const city = e.target.dataset.removeParking;
    route.parkingSelected = route.parkingSelected.filter(c=>c!==city);
    renderRouteBody();
  }));
  refreshResults();
}

function updateRoadTotal(route){
  const disp = document.getElementById('roadTotalDisplay');
  if(disp) disp.value = fmt(Number(route.road.km||0)*Number(route.road.pricePerKm||0));
  refreshResults();
}

function refreshResults(){
  const route = getRoute(activeId);
  const container = document.getElementById('resultsContainer');
  if(container) container.innerHTML = resultsCard(route);
  wireResultsEvents(route);
}

function wireResultsEvents(route){
  const profitInp = document.getElementById('profitInput');
  if(profitInp) profitInp.addEventListener('input', e=>{
    route.profit = Number(e.target.value.replace(',','.'))||0;
    updateSizeTables(route);
  });
  const agencyInp = document.getElementById('agencyInput');
  if(agencyInp) agencyInp.addEventListener('input', e=>{
    route.agency = Number(e.target.value.replace(',','.'))||0;
    updateSizeTables(route);
  });
  const systemSel = document.getElementById('systemTypeSel');
  if(systemSel) systemSel.addEventListener('change', e=>{
    route.system.type = e.target.value;
    renderRouteBody();
  });
  const customPayingInp = document.getElementById('systemCustomPaying');
  if(customPayingInp) customPayingInp.addEventListener('input', e=>{
    route.system.customPaying = Number(e.target.value)||1;
    updateSizeTables(route);
  });
  const customFreeInp = document.getElementById('systemCustomFree');
  if(customFreeInp) customFreeInp.addEventListener('input', e=>{
    route.system.customFree = Number(e.target.value)||0;
    updateSizeTables(route);
  });
}

function renderAll(){
  renderTabs();
  renderRouteBody();
}

async function init(){
  await loadRegistry();
  await loadSavedRoutes();
  routes.push(newRoute('Маршрут 1'));
  activeId = routes[0].id;
  renderAll();
  renderSavedBar();

  document.getElementById('saveRouteBtn').addEventListener('click', saveCurrentRoute);
  document.getElementById('toggleSavedBtn').addEventListener('click', ()=>{
    savedPanelOpen = !savedPanelOpen;
    renderSavedPanel();
  });
}
init();
</script>
